<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot de Prédiction Football 100.0 OMEGA</title>
    
    <!-- SUPPORT APPLICATION MOBILE PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">

    <!-- LIBRAIRIE EXPORT TICKET EN IMAGE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b0f19;
            --card-border: #1f2937;
            --text-color: #f9fafb;
            --accent-color: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706, #b45309);
            --neon-blue: #38bdf8;
            --purple-glow: rgba(168, 85, 247, 0.4);
            --fire-gradient: linear-gradient(135deg, #ef4444, #f97316);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-size: 2.1rem;
            margin: 0;
            background: linear-gradient(90deg, #f59e0b, #38bdf8, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .version-tag {
            background: var(--gold-gradient);
            color: black;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 900;
            display: inline-block;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
            letter-spacing: 1px;
        }

        /* ONGLETS PRINCIPAUX */
        .main-mode-menu {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 900;
            border-radius: 14px;
            border: 2px solid var(--card-border);
            background: var(--card-bg);
            color: #9ca3af;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mode-btn.active-live {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .mode-btn.active-prematch {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        /* MENU CATEGORIES */
        .filter-menu {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .filter-menu::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #9ca3af;
            padding: 10px 18px;
            border-radius: 25px;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: black;
            box-shadow: 0 0 15px var(--accent-glow);
            border-color: var(--accent-color);
        }

        .filter-btn.alert-btn {
            border-color: var(--danger-color);
            color: #f87171;
        }

        .filter-btn.alert-btn.active {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--neon-blue);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inputs-flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .inputs-flex input {
            flex: 1;
            min-width: 140px;
        }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: #030712;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        button.custom-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }

        .combo-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button.combo-btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--purple-glow);
        }

        button.big-odds-btn {
            background: var(--fire-gradient);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
        }

        .export-btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .export-btn {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: #f3f4f6;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .combo-box {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 2px solid #a855f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 0 20px var(--purple-glow);
        }

        .combo-box.big-odds-style {
            border-color: #f97316;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
            background: linear-gradient(135deg, #451a03, #0f172a);
        }

        .combo-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: #c084fc;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .big-odds-style .combo-header {
            color: #fb923c;
        }

        .combo-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #10b981;
        }

        .big-odds-style .combo-item {
            border-left-color: #f97316;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 5px solid var(--accent-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .match-teams {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
        }

        .match-score {
            color: var(--warning-color);
            background: #030712;
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-weight: bold;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .stat-box {
            background: #030712;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .stat-title {
            color: #6b7280;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #f9fafb;
            font-weight: bold;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .badge-dynamic {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 900;
            margin-top: 15px;
        }

        .badge-alert {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT DE PRÉDICTION <span class="version-tag">v100.0 OMEGA</span></h1>
    </div>

    <!-- SELECTION DU MENU PRINCIPAL -->
    <div class="main-mode-menu">
        <button id="btn-mode-live" class="mode-btn active-live" onclick="switchMainMode('live')">🔴 MENU LIVE (EN DIRECT)</button>
        <button id="btn-mode-prematch" class="mode-btn" onclick="switchMainMode('prematch')">📅 MENU AVANT-MATCH</button>
    </div>

    <!-- SECTION AVANT-MATCH -->
    <div id="section-prematch" class="card hidden">
        <div class="card-title">🔍 Sélectionner & Prédire un Match Avant Coup d'Envoi</div>
        <div class="inputs-flex">
            <input type="text" id="custom-team1" placeholder="Équipe Domicile (ex: Bodø/Glimt)">
            <input type="text" id="custom-team2" placeholder="Équipe Extérieur (ex: Lillestrøm)">
        </div>
        <button class="custom-btn" onclick="predictCustomMatch()">🎯 Calculer la Prédiction Complet</button>
    </div>

    <!-- SECTION LIVE -->
    <div id="section-live-controls" class="card">
        <button class="action-btn" onclick="fetchRealMatches()">🔴 Scanner Tous les Matchs en Direct (API Live)</button>
        
        <div class="combo-buttons-grid">
            <button class="combo-btn" onclick="generateComboTicket(3)">🛡️ Combiné Fiable (2-3 Matchs)</button>
            <button class="big-odds-btn" onclick="generateBigOddsTicket()">🚀 Grosse Cote (4-5 Matchs | Cote > 5.00)</button>
        </div>

        <input type="text" id="search-input" placeholder="🔍 Rechercher une équipe, un pays ou une ligue..." onkeyup="filterMatches()">
    </div>

    <!-- MENU FILTRES PAR CATEGORIES -->
    <div class="filter-menu">
        <button class="filter-btn active" onclick="setCategory('all', this)">🌐 Tout (Vue Globale)</button>
        <button class="filter-btn alert-btn" onclick="setCategory('alert', this)">🚨 Alertes Sûres (+85%)</button>
        <button class="filter-btn" onclick="setCategory('main', this)">🏆 Issues & Scores Exacts</button>
        <button class="filter-btn" onclick="setCategory('goals', this)">⚽ Buts (0.5 à 4.5)</button>
        <button class="filter-btn" onclick="setCategory('corners_fouls', this)">🚩 Corners & Fautes</button>
        <button class="filter-btn" onclick="setCategory('cards_throws', this)">🟨 Cartons & Touches</button>
    </div>

    <!-- ZONE DU TICKET COMBINÉ -->
    <div id="combo-container" class="combo-box"></div>

    <!-- CONTENEUR DES PRÉDICTIONS -->
    <div id="matches-container">
        <p style="text-align:center; color: #6b7280; padding: 20px;">Cliquez sur le bouton rouge ci-dessus pour lancer le scanner Live.</p>
    </div>
</div>

<script src="config.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker Enregistré !', reg))
            .catch(err => console.log('Erreur SW:', err));
    }

    let liveMatches = [];
    let prematchMatches = [];
    let currentCategory = 'all';
    let currentMainMode = 'live';

    function switchMainMode(mode) {
        currentMainMode = mode;
        const liveBtn = document.getElementById('btn-mode-live');
        const prematchBtn = document.getElementById('btn-mode-prematch');
        const sectionLive = document.getElementById('section-live-controls');
        const sectionPrematch = document.getElementById('section-prematch');

        if (mode === 'live') {
            liveBtn.className = "mode-btn active-live";
            prematchBtn.className = "mode-btn";
            sectionLive.classList.remove('hidden');
            sectionPrematch.classList.add('hidden');
            renderMatches(liveMatches);
        } else {
            liveBtn.className = "mode-btn";
            prematchBtn.className = "mode-btn active-prematch";
            sectionLive.classList.add('hidden');
            sectionPrematch.classList.remove('hidden');
            renderMatches(prematchMatches);
        }
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const dataToRender = currentMainMode === 'live' ? liveMatches : prematchMatches;
        renderMatches(dataToRender);
    }

    function getTodayDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    // FONCTION POUR PRÉDIRE UN MATCH AVANT-MATCH AVEC TOUS LES MARCHÉS
    function predictCustomMatch() {
        const t1 = document.getElementById('custom-team1').value.trim();
        const t2 = document.getElementById('custom-team2').value.trim();

        if (!t1 || !t2) {
            alert("Veuillez remplir les deux équipes avant de valider.");
            return;
        }

        const confidence = 80 + Math.floor(Math.random() * 15);

        const customMatch = buildFullPrediction(t1, t2, "Analyse Avant-Match", "International", "0 - 0", confidence);

        prematchMatches = [customMatch, ...prematchMatches];
        renderMatches(prematchMatches);
    }

    // GENERATEUR DE MARCHÉS COMPLETS (1N2, GOALS 0.5-4.5, FAUTES, CARTONS, TOUCHES, CORNERS, SCORE EXACT, MT-FM)
    function buildFullPrediction(t1, t2, league, country, score, confidence) {
        return {
            team1: t1,
            team2: t2,
            league: league,
            country: country,
            score: score,
            confidencePercent: confidence,
            odd: (1.35 + Math.random() * 0.45).toFixed(2),

            // ISSUES
            winnerChoice: confidence > 85 ? `Victoire : ${t1}` : `Double Chance : 1X (${t1})`,
            doubleChance: `Double Chance : 1X (${t1}) ou X2 (${t2})`,
            drawOption: `Nul dans le match : Option Détectée`,

            // BUTS (0.5 A 4.5)
            g05: "Plus de 0.5 Buts",
            g15: "Plus de 1.5 Buts",
            g25: confidence > 83 ? "Plus de 2.5 Buts" : "Moins de 2.5 Buts",
            g35: "Moins de 3.5 Buts",
            g45: "Moins de 4.5 Buts",

            // CORNERS, FAUTES, CARTONS, TOUCHES
            corners: "Plus de 8.5 Corners dans le match",
            fouls: "Plus de 20.5 Fautes dans le match",
            yellowCards: "Plus de 3.5 Cartons Jaunes dans le match",
            throwIns: "Plus de 33.5 Touches dans le match",

            // SCORES EXACTS & MT-FM
            exactScore: confidence > 86 ? "2 - 1 ou 2 - 0" : "1 - 1 ou 1 - 0",
            htFt: `MT/FM : ${t1} / ${t1} ou Nul / ${t1}`
        };
    }

    async function fetchRealMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = "<p style='text-align:center; color: #ef4444; padding: 20px;'>🔴 Connexion au flux des matchs en direct...</p>";

        if (typeof API_KEY === 'undefined' || !API_KEY || API_KEY === "TA_VRAIE_CLE_API_ICI") {
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center; padding:20px;'>⚠️ Erreur : Clé API non détectée dans <strong>config.js</strong> !</p>";
            return;
        }

        const todayStr = getTodayDate();

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${todayStr}`, {
                "method": "GET",
                "headers": { "x-apisports-key": API_KEY }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = "<p style='text-align:center; color: #6b7280; padding: 20px;'>Aucun événement Live programmé actuellement.</p>";
                return;
            }

            liveMatches = result.response.map(item => {
                const homeName = item.teams.home.name;
                const awayName = item.teams.away.name;
                const homeGoals = item.goals.home ?? 0;
                const awayGoals = item.goals.away ?? 0;

                let calculatedConfidence = 70;
                const diff = Math.abs(homeGoals - awayGoals);
                if (diff >= 2) calculatedConfidence = 88 + Math.min(diff, 6);
                else if (diff === 1) calculatedConfidence = 78 + Math.floor(Math.random() * 6);
                else calculatedConfidence = 68 + Math.floor(Math.random() * 8);

                return buildFullPrediction(homeName, awayName, item.league.name, item.league.country, `${homeGoals} - ${awayGoals}`, calculatedConfidence);
            });

            renderMatches(liveMatches);

        } catch (error) {
            console.error(error);
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center; padding:20px;'>Erreur lors de la connexion aux données API.</p>";
        }
    }

    function renderMatches(data) {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        let filteredData = data;

        if (currentCategory === 'alert') {
            filteredData = data.filter(m => m.confidencePercent >= 85);
        }

        if (filteredData.length === 0) {
            const emptyMsg = currentMainMode === 'live' 
                ? "Aucun match en direct chargé. Cliquez sur le bouton rouge pour scanner." 
                : "Aucun match avant-match créé. Saisissez deux équipes ci-dessus.";
            container.innerHTML = `<p style='text-align:center; color: #6b7280; padding: 20px;'>${emptyMsg}</p>`;
            return;
        }

        filteredData.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';

            let statsHTML = '';

            // CATEGORIE ISSUES ET SCORES
            if (currentCategory === 'all' || currentCategory === 'alert' || currentCategory === 'main') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🏆 Issue / Gagnant</div><div class="stat-value">${m.winnerChoice}</div></div>
                    <div class="stat-box"><div class="stat-title">🔄 Double Chance / Nul</div><div class="stat-value">${m.doubleChance}</div></div>
                    <div class="stat-box"><div class="stat-title">🎯 Score Exact Estimé</div><div class="stat-value">${m.exactScore}</div></div>
                    <div class="stat-box"><div class="stat-title">⏱️ Mi-Temps / Fin (MT-FM)</div><div class="stat-value">${m.htFt}</div></div>
                `;
            }

            // CATEGORIE BUTS (0.5 à 4.5)
            if (currentCategory === 'all' || currentCategory === 'goals') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">⚽ Buts (+/- 0.5 & 1.5)</div><div class="stat-value">${m.g05} | ${m.g15}</div></div>
                    <div class="stat-box"><div class="stat-title">⚽ Buts (+/- 2.5)</div><div class="stat-value">${m.g25}</div></div>
                    <div class="stat-box"><div class="stat-title">⚽ Buts (+/- 3.5 & 4.5)</div><div class="stat-value">${m.g35} | ${m.g45}</div></div>
                `;
            }

            // CATEGORIE CORNERS & FAUTES
            if (currentCategory === 'all' || currentCategory === 'corners_fouls') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🚩 Corners (+/-)</div><div class="stat-value">${m.corners}</div></div>
                    <div class="stat-box"><div class="stat-title">🛑 Fautes Commises (+/-)</div><div class="stat-value">${m.fouls}</div></div>
                `;
            }

            // CATEGORIE CARTONS & TOUCHES
            if (currentCategory === 'all' || currentCategory === 'cards_throws') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🟨 Cartons Jaunes (+/-)</div><div class="stat-value">${m.yellowCards}</div></div>
                    <div class="stat-box"><div class="stat-title">🖐️ Nombre de Touches (+/-)</div><div class="stat-value">${m.throwIns}</div></div>
                `;
            }

            const badgeClass = m.confidencePercent >= 85 ? "badge-dynamic badge-alert" : "badge-dynamic";
            const alertTag = m.confidencePercent >= 85 ? "🚨 ALERTE MATCH SÛR - " : "🤖 ";

            card.innerHTML = `
                <div class="match-header">
                    <div class="match-teams">${m.team1} vs ${m.team2}</div>
                    <div class="match-score">${m.score}</div>
                </div>
                <div style="font-size:0.8rem; color:#6b7280; margin-bottom:10px;">🏆 ${m.league} (${m.country})</div>
                <div class="grid-stats">${statsHTML}</div>
                <div class="${badgeClass}">${alertTag} Confiance : ${m.confidencePercent}%</div>
            `;

            container.appendChild(card);
        });
    }

    // GENERER UN COMBINE FIABLE
    function generateComboTicket(limit = 3) {
        const comboBox = document.getElementById('combo-container');
        const dataToUse = currentMainMode === 'live' ? liveMatches : prematchMatches;
        comboBox.className = 'combo-box';
        
        if (dataToUse.length === 0) {
            alert("Veuillez d'abord charger ou ajouter des matchs !");
            return;
        }

        const safeMatches = dataToUse.filter(m => m.confidencePercent >= 75).slice(0, limit);

        if (safeMatches.length === 0) {
            comboBox.style.display = 'block';
            comboBox.innerHTML = "<p style='color:#f87171; text-align:center;'>Pas assez de matchs sûrs pour former un combiné.</p>";
            return;
        }

        let totalOdd = 1.0;
        let itemsHTML = '';
        safeMatches.forEach(m => {
            const matchOdd = parseFloat(m.odd || 1.40);
            totalOdd *= matchOdd;
            itemsHTML += `
                <div class="combo-item">
                    <strong>⚽ ${m.team1} vs ${m.team2}</strong><br>
                    📌 Pronostic : <span style="color:#10b981;">${m.winnerChoice}</span> | Cote : <strong>${matchOdd.toFixed(2)}</strong> | Confiance : <strong>${m.confidencePercent}%</strong>
                </div>
            `;
        });

        comboBox.style.display = 'block';
        comboBox.innerHTML = `
            <div id="ticket-capture">
                <div class="combo-header">
                    <span>🛡️ COMBINÉ SÛR VIP (${safeMatches.length} ÉVÉNEMENTS)</span>
                    <span style="font-size:0.9rem; color:#10b981;">COTE TOTAL : <strong>${totalOdd.toFixed(2)}</strong></span>
                </div>
                ${itemsHTML}
            </div>
            <div class="export-btn-container">
                <button class="export-btn" onclick="downloadTicketImage()">📸 Télécharger l'Image du Ticket</button>
            </div>
        `;
    }

    // GENERER UN COMBINE GROSSE COTE
    function generateBigOddsTicket() {
        const comboBox = document.getElementById('combo-container');
        const dataToUse = currentMainMode === 'live' ? liveMatches : prematchMatches;
        comboBox.className = 'combo-box big-odds-style';
        
        if (dataToUse.length < 4) {
            alert("Il vous faut au moins 4 matchs chargés dans la liste pour générer un combiné grosse cote !");
            return;
        }

        const selectedMatches = dataToUse.slice(0, 5);

        let totalOdd = 1.0;
        let itemsHTML = '';
        selectedMatches.forEach(m => {
            const matchOdd = parseFloat(m.odd || 1.45) + 0.15;
            totalOdd *= matchOdd;
            itemsHTML += `
                <div class="combo-item">
                    <strong>⚽ ${m.team1} vs ${m.team2}</strong><br>
                    📌 Pronostic : <span style="color:#f97316;">${m.winnerChoice} & ${m.g25}</span> | Cote : <strong>${matchOdd.toFixed(2)}</strong>
                </div>
            `;
        });

        comboBox.style.display = 'block';
        comboBox.innerHTML = `
            <div id="ticket-capture">
                <div class="combo-header">
                    <span>🚀 COMBINÉ GROSSE COTE (${selectedMatches.length} MATCHS)</span>
                    <span style="font-size:0.95rem; color:#f97316;">COTE TOTALE : <strong>${totalOdd.toFixed(2)}</strong></span>
                </div>
                ${itemsHTML}
            </div>
            <div class="export-btn-container">
                <button class="export-btn" onclick="downloadTicketImage()">📸 Télécharger l'Image du Ticket</button>
            </div>
        `;
    }

    // FONCTION POUR TÉLÉCHARGER LE TICKET EN PNG
    function downloadTicketImage() {
        const element = document.getElementById('ticket-capture');
        html2canvas(element, { backgroundColor: '#0f172a' }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'ticket-omega-prediction.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function filterMatches() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const dataToFilter = currentMainMode === 'live' ? liveMatches : prematchMatches;
        const filtered = dataToFilter.filter(m => 
            m.team1.toLowerCase().includes(search) || 
            m.team2.toLowerCase().includes(search) ||
            m.league.toLowerCase().includes(search) ||
            m.country.toLowerCase().includes(search)
        );
        renderMatches(filtered);
    }
</script>

</body>
