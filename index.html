<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Football AI Pro — outil de prédiction de matchs de football (version 2.0).">
  <link rel="icon" href="favicon.ico">
  <title>Football AI Pro 2.0</title>

  <style>
    :root{
      --bg:#0f172a;
      --header:#16a34a;
      --card:#0f172a9a; /* subtle transparent card */
      --card-contrast:#111827;
      --button:#16a34a;
      --button-hover:#15803d;
      --text:#ffffff;
    }

    html,body{height:100%;margin:0;}
    body{
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    header{
      background:var(--header);
      padding:18px 20px;
      font-size:1.25rem;
      font-weight:700;
      color:white;
      text-align:center;
    }

    main.container{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      background:linear-gradient(180deg, rgba(30,41,59,0.9), rgba(17,24,39,0.9));
      padding:28px;
      border-radius:14px;
      max-width:720px;
      width:100%;
      box-shadow:0 8px 24px rgba(2,6,23,0.6);
      text-align:center;
    }

    h1{margin:0 0 12px;font-size:1.6rem;}
    h2{margin:0 0 8px;font-size:1.25rem;}
    p{margin:8px 0;color:#d1d5db;}

    .controls{
      margin-top:20px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      background:var(--button);
      color:white;
      padding:12px 20px;
      border:none;
      border-radius:10px;
      font-size:1rem;
      cursor:pointer;
      transition:transform .08s ease, background .12s ease;
    }

    button:hover{background:var(--button-hover); transform:translateY(-1px);}
    button:active{transform:translateY(0);}
    button:focus{outline:3px solid rgba(21,128,61,0.25); outline-offset:2px;}
    /* reduced motion respect */
    @media (prefers-reduced-motion:reduce){ button, *{transition:none!important;} }

    footer{
      padding:12px 16px;
      text-align:center;
      font-size:0.85rem;
      color:#9ca3af;
    }

    /* responsive */
    @media (max-width:420px){
      .card{padding:18px;border-radius:12px;}
      h1{font-size:1.25rem;}
      button{width:100%;}
    }
  </style>
</head>

<body>
  <header role="banner" aria-label="Football AI Pro en-tête">
    ⚽ Football AI Pro 2.0
  </header>

  <main class="container" role="main">
    <section class="card" role="region" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Bienvenue</h1>

      <p>Le robot de prédiction de football est en cours de construction.</p>
      <p><strong>Version 2.0</strong></p>

      <div class="controls">
        <button id="analyzeBtn" type="button" aria-label="Analyser un match">Analyser un match</button>
        <button id="learnMoreBtn" type="button" aria-label="En savoir plus">En savoir plus</button>
      </div>
    </section>
  </main>

  <footer role="contentinfo">
    © <span id="year"></span> Football AI Pro — Prototype
  </footer>

  <script>
    // Small progressive enhancement: placeholder handlers
    document.getElementById('year').textContent = new Date().getFullYear();

    const analyzeBtn = document.getElementById('analyzeBtn');
    analyzeBtn.addEventListener('click', () => {
      // placeholder — replace with real logic (API call / modal / navigation)
      alert("Fonctionnalité 'Analyser un match' à venir. Je peux l'implémenter si vous le souhaitez.");
    });

    document.getElementById('learnMoreBtn').addEventListener('click', () => {
      // graceful scroll or open a modal in the future
      alert("Plus d'informations à venir. Voulez-vous que j'ajoute une page 'À propos' ?");
    });
  </script>
</body>
</html>
