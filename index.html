<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot de Prédiction Football PRO & FIFA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --success-color: #22c55e;
            --warning-color: #eab308;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            text-align: center;
            color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2563eb;
        }

        .btn-filter {
            background-color: #334155;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .btn-filter:hover {
            background-color: var(--accent-color);
        }

        .match-card {
            border-left: 4px solid var(--accent-color);
            margin-bottom: 15px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .badge-green { background-color: var(--success-color); color: black; }
        .badge-yellow { background-color: var(--warning-color); color: black; }
        .badge-red { background-color: var(--danger-color); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Robot de Prédiction Football PRO & FIFA</h1>

    <!-- GÉNÉRATEUR DE PRÉDICTIONS FIFA -->
    <div class="card" style="text-align: center;">
        <h2>Robot de Pronostics FIFA / eSports</h2>
        <p>Générez des prédictions analysées automatiquement pour les matchs FIFA en direct.</p>
        <button onclick="generateFifaCoupon()">Générer un Pronostic FIFA</button>
        <div id="fifa-coupon-result"></div>
    </div>

    <!-- CALCULATRICE KELLY -->
    <div class="card">
        <h2>Calculatrice de Mise (Critère de Kelly)</h2>
        <div class="grid-2">
            <input type="number" id="bankroll" placeholder="Capital total (€)">
            <input type="number" id="odd" placeholder="Cote du pari" step="0.01">
        </div>
        <div class="grid-2">
            <input type="number" id="probability" placeholder="Probabilité estimée (%)">
            <button onclick="calculateKelly()">Calculer la Mise</button>
        </div>
        <div id="kelly-result"></div>
    </div>

    <!-- RECHERCHE ET FILTRES DE MATCHS -->
    <div class="card">
        <h2>Filtres et Recherche</h2>
        <input type="text" id="search-input" placeholder="Rechercher une équipe..." onkeyup="filterMatches()">
        <div class="grid-2">
            <select id="country-select" onchange="filterMatches()">
                <option value="ALL">Tous les pays</option>
                <option value="FIFA">FIFA / Virtuel</option>
                <option value="ENG">Angleterre</option>
                <option value="ESP">Espagne</option>
                <option value="ITA">Italie</option>
                <option value="FRA">France</option>
                <option value="INT">International</option>
            </select>
            <select id="division-select" onchange="filterMatches()">
                <option value="ALL">Toutes les divisions</option>
                <option value="D1">Division 1</option>
                <option value="D2">Division 2</option>
            </select>
        </div>

        <!-- BARRE DE FILTRES RAPIDES -->
        <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
            <button class="btn-filter" onclick="quickFilter('ALL')">Tous</button>
            <button class="btn-filter" onclick="quickFilter('SAFE')">Pari Sûr (&gt;75%)</button>
            <button class="btn-filter" onclick="quickFilter('GOALS')">Over 2.5</button>
            <button class="btn-filter" onclick="quickFilter('BTTS')">Les 2 marquent</button>
        </div>
    </div>

    <!-- LISTE DES MATCHS -->
    <div id="matches-container"></div>
</div>

<script>
    // Équipes FIFA pour le simulateur
    const fifaTeams = [
        "Real Madrid (eSports)", "Manchester City (eSports)", "Barcelona (eSports)", 
        "Bayern Munich (eSports)", "PSG (eSports)", "Liverpool (eSports)", 
        "Arsenal (eSports)", "Inter Milan (eSports)"
    ];

    // Données fictives initiales
    const matchesData = [
        { id: 1, country: 'ENG', division: 'D1', team1: 'Arsenal', team2: 'Chelsea', proba: 78, type: 'SAFE', over: true, btts: true },
        { id: 2, country: 'ESP', division: 'D1', team1: 'Real Madrid', team2: 'Barcelone', proba: 65, type: 'RISK', over: true, btts: true },
        { id: 3, country: 'FRA', division: 'D1', team1: 'PSG', team2: 'OM', proba: 82, type: 'SAFE', over: true, btts: false },
        { id: 4, country: 'FIFA', division: 'D1', team1: 'Man City (eSports)', team2: 'Bayern (eSports)', proba: 74, type: 'GOALS', over: true, btts: true }
    ];

    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateFifaPrediction() {
        let team1 = getRandomItem(fifaTeams);
        let team2 = getRandomItem(fifaTeams);
        while (team1 === team2) {
            team2 = getRandomItem(fifaTeams);
        }

        const proba1 = Math.floor(Math.random() * 40) + 35;
        const over25Proba = Math.floor(Math.random() * 30) + 60;

        let advice = "";
        if (over25Proba > 75) {
            advice = "Plus de 2.5 Buts dans le match";
        } else if (proba1 > 65) {
            advice = `Victoire de ${team1}`;
        } else {
            advice = "Les deux équipes marquent (Oui)";
        }

        return {
            teams: `${team1} vs ${team2}`,
            proba: Math.max(proba1, over25Proba),
            advice: advice
        };
    }

    function generateFifaCoupon() {
        const resultDiv = document.getElementById('fifa-coupon-result');
        resultDiv.innerHTML = "<p><em>Analyse des algorithmes FIFA en cours...</em></p>";

        setTimeout(() => {
            let pred1 = generateFifaPrediction();
            let pred2 = generateFifaPrediction();

            resultDiv.innerHTML = `
                <div style="background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left;">
                    <h3 style="color: var(--success-color); margin-top:0;">🤖 Pronostics FIFA Générés</h3>
                    <p><strong>Match 1 :</strong> ${pred1.teams}<br>
                       👉 <strong>Conseil :</strong> ${pred1.advice} (${pred1.proba}% de confiance)</p>
                    <hr style="border-color: #334155;">
                    <p><strong>Match 2 :</strong> ${pred2.teams}<br>
                       👉 <strong>Conseil :</strong> ${pred2.advice} (${pred2.proba}% de confiance)</p>
                </div>
            `;
        }, 400);
    }

    function calculateKelly() {
        const b = parseFloat(document.getElementById('bankroll').value);
        const o = parseFloat(document.getElementById('odd').value);
        const p = parseFloat(document.getElementById('probability').value) / 100;

        if (!b || !o || !p) {
            document.getElementById('kelly-result').innerHTML = "<p style='color:var(--danger-color)'>Veuillez remplir tous les champs.</p>";
            return;
        }

        const q = 1 - p;
        const bDecimal = o - 1;
        const kellyFraction = ((bDecimal * p) - q) / bDecimal;

        if (kellyFraction <= 0) {
            document.getElementById('kelly-result').innerHTML = "<p style='color:var(--warning-color)'>Pari non recommandé.</p>";
        } else {
            const stake = (b * kellyFraction * 0.5).toFixed(2);
            document.getElementById('kelly-result').innerHTML = `<p style='color:var(--success-color)'>Mise conseillée : <strong>${stake} €</strong></p>`;
        }
    }

    function renderMatches(data) {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        data.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <h3>${m.team1} vs ${m.team2}</h3>
                <p>Pays: ${m.country} | Division: ${m.division}</p>
                <p>Probabilité de réussite : <strong>${m.proba}%</strong></p>
                <span class="badge ${m.proba > 75 ? 'badge-green' : 'badge-yellow'}">${m.proba > 75 ? 'Pari Sûr' : 'Pari Modéré'}</span>
            `;
            container.appendChild(card);
        });
    }

    function filterMatches() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const country = document.getElementById('country-select').value;
        const division = document.getElementById('division-select').value;

        const filtered = matchesData.filter(m => {
            const matchSearch = m.team1.toLowerCase().includes(search) || m.team2.toLowerCase().includes(search);
            const matchCountry = country === 'ALL' || m.country === country;
            const matchDivision = division === 'ALL' || m.division === division;

            return matchSearch && matchCountry && matchDivision;
        });

        renderMatches(filtered);
    }

    function quickFilter(type) {
        if (type === 'ALL') {
            renderMatches(matchesData);
        } else if (type === 'SAFE') {
            renderMatches(matchesData.filter(m => m.proba >= 75));
        } else if (type === 'GOALS') {
            renderMatches(matchesData.filter(m => m.over));
        } else if (type === 'BTTS') {
            renderMatches(matchesData.filter(m => m.btts));
        }
    }

    // Affichage initial
    renderMatches(matchesData);
</script>

</body>
</html>
