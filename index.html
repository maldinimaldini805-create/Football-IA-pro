<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot OMEGA PRO - Recherche & Combinés</title>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --neon-blue: #38bdf8;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .btn-search {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .match-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .match-details {
            flex: 1;
        }

        .team-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .match-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        #ticket-result {
            display: none;
            background: #0f172a;
            border: 2px solid var(--accent-orange);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
        }

        #ticket-result h3 {
            margin-top: 0;
            color: var(--accent-orange);
            font-size: 1.1rem;
            text-align: center;
        }

        .ticket-item {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-green);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT OMEGA PRO</h1>
        <span style="color:var(--accent-green); font-size: 0.8rem;">GÉNÉRATEUR DE COMBINÉS</span>
    </div>

    <!-- BOUTON DE RECHERCHE DES MATCHS -->
    <button class="btn-search" onclick="rechercherMatchs()">🔍 Rechercher les matchs disponibles</button>

    <!-- Liste des Matchs trouvés -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--neon-blue);">⚽ Coche les matchs pour le combiné</h3>
        
        <div id="matches-list">
            <p style="color: var(--text-muted); text-align: center;">Clique sur "Rechercher les matchs" ci-dessus pour charger la liste.</p>
        </div>

        <button class="action-btn" onclick="genererTicketCombine()">🎯 Générer le Ticket Combiné par le Robot</button>
    </div>

    <!-- Zone du Ticket de Combiné -->
    <div id="ticket-result">
        <h3>🎫 Ticket Combiné Conseillé</h3>
        <div id="ticket-items"></div>
    </div>
</div>

<script>
    // Fonction pour rechercher et charger les matchs depuis Python
    async function rechercherMatchs() {
        const container = document.getElementById('matches-list');
        container.innerHTML = '<p style="text-align:center; color: var(--neon-blue);">Chargement des matchs en cours...</p>';

        try {
            const response = await fetch('/api/matchs');
            const data = await response.json();

            container.innerHTML = ''; // Effacer le message de chargement

            if (data.matchs.length === 0) {
                container.innerHTML = '<p style="text-align:center;">Aucun match trouvé pour le moment.</p>';
                return;
            }

            // Afficher chaque match avec sa case à cocher
            data.matchs.forEach((m, index) => {
                const idMatch = 'match_' + index;
                const matchDiv = document.createElement('div');
                matchDiv.className = 'match-card';
                matchDiv.innerHTML = `
                    <input type="checkbox" class="match-checkbox" value="${m.equipes}" id="${idMatch}">
                    <div class="match-details">
                        <label for="${idMatch}" class="team-title">${m.equipes}</label>
                        <div class="match-info">Cotes: ${m.cote_1} | ${m.cote_N} | ${m.cote_2}</div>
                    </div>
                `;
                container.appendChild(matchDiv);
            });

        } catch (erreur) {
            console.error("Erreur de recherche:", erreur);
            container.innerHTML = '<p style="text-align:center; color: red;">Erreur lors de la recherche des matchs.</p>';
        }
    }

    // Fonction pour demander au robot d'analyser les matchs cochés et créer le combiné
    async function genererTicketCombine() {
        const checkboxes = document.querySelectorAll('.match-checkbox:checked');
        const matchsSelectionnes = [];

        checkboxes.forEach(cb => {
            matchsSelectionnes.push(cb.value);
        });

        if (matchsSelectionnes.length < 2) {
            alert("Veuillez cocher au moins 2 matchs pour faire une combinaison !");
            return;
        }

        try {
            const response = await fetch('/api/combine', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ matchs: matchsSelectionnes })
            });

            const data = await response.json();
            
            if (data.status === 'success') {
                afficherTicket(data.combine);
            }
        } catch (erreur) {
            console.error("Erreur avec le robot Python:", erreur);
        }
    }

    function afficherTicket(combineData) {
        const container = document.getElementById('ticket-result');
        const list = document.getElementById('ticket-items');
        list.innerHTML = '';

        combineData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'ticket-item';
            div.innerHTML = `
                <div><strong>Match :</strong> ${item.match}</div>
                <div><strong>Choix Robot :</strong> <span style="color:var(--accent-green);">${item.choix}</span></div>
                <div><strong>Probabilité calculée :</strong> ${item.pourcentage}%</div>
            `;
            list.appendChild(div);
        });

        container.style.display = 'block';
    }
</script>

</body>
</html>
