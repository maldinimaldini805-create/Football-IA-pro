<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI Pro 3.0</title>

<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<header class="top-bar">

    <div class="logo">

        ⚽ Football AI Pro

    </div>

    <div class="live-badge">

        🔴 LIVE

    </div>

</header>

<main class="container">

<section class="match-card">

<h2 id="matchTitle">
Manchester City
VS
Liverpool
</h2>

<div class="confidence">

<p>Confiance IA</p>

<div class="progress">

<div
class="progress-value"
style="width:82%;">

82%

</div>

</div>

</div>

<div class="prediction-grid">

<div class="box">

<h3>🎯 Score</h3>

<p id="scorePrediction">

2 - 1

</p>

</div>

<div class="box">

<h3>⏱️ Mi-temps</h3>

<p id="halfTimePrediction">

1 - 0

</p>

</div>

<div class="box">

<h3>🚩 Corners</h3>

<p id="cornerPrediction">

10

</p>

</div>

<div class="box">

<h3>🟨 Cartons</h3>

<p id="cardsPrediction">

4

</p>

</div>

<div class="box">

<h3>❌ Fautes</h3>

<p id="foulsPrediction">

23

</p>

</div>

<div class="box">

<h3>⚽ BTTS</h3>

<p id="bttsPrediction">

Oui (74%)

</p>

</div>

</div>

</section>

<section>

<h2>

Matchs du jour

</h2>

<div
id="matchesContainer">

</div>

</section>

</main>

<script type="module" src="js/dashboard.js"></script>

</body>

</html>
