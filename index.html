<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Moteur OMEGA IA - Version Intelligente</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --neon-blue: #38bdf8;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        /* BANNIÈRE DE MISE À JOUR 7 JOURS */
        .update-banner {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--neon-blue);
            margin-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }

        .section-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-top: 6px;
            grid-column: 1 / -1;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        /* AFFICHAGE DES RÉSULTATS DÉTAILLÉS */
        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .pred-box {
            background: #0f172a;
            padding: 8px 10px;
            border-radius: 8px;
            border-left: 3px solid var(--neon-blue);
        }

        .pred-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .pred-val {
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            margin-top: 2px;
        }

        /* BARRE DE NAVIGATION INFÉRIEURE */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
        }

        .nav-item.active {
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT OMEGA IA v2.0</h1>
    </div>

    <!-- MODULE DE MISE À JOUR 7 JOURS -->
    <div class="update-banner">
        <span>🔄 Mise à jour hebdo IA : <strong id="update-status">À jour</strong></span>
        <button onclick="forceWeeklyUpdate()" style="background:var(--accent-orange); border:none; padding:4px 8px; border-radius:6px; font-weight:bold; cursor:pointer;">Actualiser</button>
    </div>

    <!-- FORMULAIRE DE SAISIE AVANCÉ -->
    <div class="card">
        <div class="card-title">⚽ Analyse d'un Match</div>
        <div class="form-grid">
            <div class="section-label">Équipes & Cotes 1X2</div>
            <input type="text" id="t1" placeholder="Équipe Domicile">
            <input type="text" id="t2" placeholder="Équipe Extérieur">
            <input type="number" step="0.01" id="c1" placeholder="Cote 1">
            <input type="number" step="0.01" id="cX" placeholder="Cote X">
            <input type="number" step="0.01" id="c2" placeholder="Cote 2">

            <div class="section-label">Moyennes Statistiques (Derniers Matchs)</div>
            <input type="number" step="0.1" id="stat-goals" placeholder="Moy. Buts (ex: 2.8)">
            <input type="number" step="0.1" id="stat-cards" placeholder="Moy. Cartons (ex: 4.2)">
            <input type="number" step="0.1" id="stat-fouls" placeholder="Moy. Fautes (ex: 22.5)">
            <input type="number" step="0.1" id="stat-corners" placeholder="Moy. Corners (ex: 9.5)">
            <input type="number" step="0.1" id="stat-shots" placeholder="Moy. Tirs (ex: 12.0)">
        </div>
        <button class="action-btn" onclick="runSmartAnalysis()">🧠 Lancer l'Analyse 360°</button>
    </div>

    <!-- RÉSULTATS D'ANALYSE -->
    <div id="results-container"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active">🔥 Pronos</div>
    <div class="nav-item">📊 Stats</div>
    <div class="nav-item">🧠 Apprentissage</div>
    <div class="nav-item">⚙️ Réglages</div>
</div>

<script>
    // 1. GESTION DU CYCLE DE MISE À JOUR TOUS LES 7 JOURS
    function checkWeeklyUpdate() {
        const lastUpdate = localStorage.getItem('last_ia_update');
        const now = new Date().getTime();
        const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;

        if (!lastUpdate || (now - lastUpdate) > sevenDaysInMs) {
            forceWeeklyUpdate();
        } else {
            const nextUpdateDays = Math.ceil((sevenDaysInMs - (now - lastUpdate)) / (1000 * 60 * 60 * 24));
            document.getElementById('update-status').innerText = `Prochaine dans ${nextUpdateDays}j`;
        }
    }

    function forceWeeklyUpdate() {
        localStorage.setItem('last_ia_update', new Date().getTime());
        document.getElementById('update-status').innerText = "Mis à jour !";
        alert("✅ Robot mis à jour : Les coefficients statistiques et l'algorithme d'apprentissage ont été réactualisés pour les 7 prochains jours.");
    }

    // 2. MOTEUR D'ANALYSE INTELLIGENT (LES 9 MARCHÉS)
    function runSmartAnalysis() {
        const t1 = document.getElementById('t1').value.trim();
        const t2 = document.getElementById('t2').value.trim();
        const c1 = parseFloat(document.getElementById('c1').value) || 2.10;
        const cX = parseFloat(document.getElementById('cX').value) || 3.20;
        const c2 = parseFloat(document.getElementById('c2').value) || 3.40;

        const gAvg = parseFloat(document.getElementById('stat-goals').value) || 2.5;
        const cardAvg = parseFloat(document.getElementById('stat-cards').value) || 4.0;
        const foulAvg = parseFloat(document.getElementById('stat-foulAvg').value) || 22.0;
        const cornerAvg = parseFloat(document.getElementById('stat-corners').value) || 9.0;
        const shotAvg = parseFloat(document.getElementById('stat-shots').value) || 11.5;

        if (!t1 || !t2) {
            alert("Veuillez remplir au moins le nom des deux équipes.");
            return;
        }

        // Calculs dynamiques
        const prob1 = (1 / c1) * 100;
        const prob2 = (1 / c2) * 100;

        // Issue du match (Victoire vs Double Chance)
        let mainIssue = prob1 > prob2 ? `1 (${t1})` : `2 (${t2})`;
        let doubleChance = prob1 > prob2 ? `1X (${t1} ou Nul)` : `X2 (${t2} ou Nul)`;
        let finalWinnerChoice = Math.abs(prob1 - prob2) > 15 ? mainIssue : doubleChance;

        // Score exact estimé
        let estimatedScore = gAvg > 3.0 ? "2 - 1" : (gAvg < 2.0 ? "1 - 0" : "1 - 1");

        const container = document.getElementById('results-container');
        container.innerHTML = `
            <div class="match-card">
                <div class="match-header">
                    <span>${t1}</span>
                    <span style="color:var(--neon-blue);">VS</span>
                    <span>${t2}</span>
                </div>
                <div class="predictions-grid">
                    <div class="pred-box">
                        <div class="pred-label">Résultat Conseillé</div>
                        <div class="pred-val" style="color:var(--accent-green);">${finalWinnerChoice}</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Buts 1re / 2e Mi-temps</div>
                        <div class="pred-val">${(gAvg * 0.4).toFixed(1)} / ${(gAvg * 0.6).toFixed(1)} Buts</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Buts Temps Réglementaire</div>
                        <div class="pred-val">${gAvg > 2.5 ? '+2.5 Buts' : '-2.5 Buts'}</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Les 2 équipes marquent</div>
                        <div class="pred-val">${gAvg > 2.4 ? 'OUI' : 'NON'}</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Cartons Jaunes</div>
                        <div class="pred-val">${cardAvg > 4.5 ? '+4.5 Cartons' : '-4.5 Cartons'}</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Fautes Totales</div>
                        <div class="pred-val">${foulAvg > 23 ? '+23.5 Fautes' : '-23.5 Fautes'}</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Corners</div>
                        <div class="pred-val">${cornerAvg > 9.5 ? '+9.5 Corners' : '-9.5 Corners'}</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Tirs & Tirs Cadrés</div>
                        <div class="pred-val">${shotAvg.toFixed(0)} Tirs / ${(shotAvg * 0.35).toFixed(0)} Cadrés</div>
                    </div>
                    <div class="pred-box">
                        <div class="pred-label">Score Exact Estimé</div>
                        <div class="pred-val" style="color:var(--accent-orange);">${estimatedScore}</div>
                    </div>
                </div>
            </div>
        `;
    }

    // Vérification automatique au lancement
    checkWeeklyUpdate();
</script>

</body>
</html>
