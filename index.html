<script src="config.js"></script>

<script>
    let liveMatches = [];

    // Équipes FIFA pour le simulateur
    const fifaTeams = [
        "Real Madrid (eSports)", "Manchester City (eSports)", "Barcelona (eSports)", 
        "Bayern Munich (eSports)", "PSG (eSports)", "Liverpool (eSports)"
    ];

    // Charger les matchs réels depuis l'API Football
    async function fetchRealMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = "<p style='text-align:center; color: #94a3b8;'>Récupération des matchs réels en cours...</p>";

        if (typeof API_KEY === 'undefined' || API_KEY === "TA_VRAIE_CLE_API_ICI" || !API_KEY) {
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center;'>⚠️ Erreur : Clé API non configurée dans <strong>config.js</strong> !</p>";
            return;
        }

        try {
            const response = await fetch("https://v3.football.api-sports.io/fixtures?live=all", {
                "method": "GET",
                "headers": {
                    "x-apisports-key": API_KEY
                }
            });

            const result = await response.json();
            
            if (result.errors && Object.keys(result.errors).length > 0) {
                container.innerHTML = `<p style='color:var(--danger-color); text-align:center;'>Erreur API : ${JSON.stringify(result.errors)}</p>`;
                return;
            }

            if (!result.response || result.response.length === 0) {
                container.innerHTML = "<p style='text-align:center; color: #94a3b8;'>Aucun match en direct disponible actuellement. Réessayez plus tard !</p>";
                return;
            }

            // Transformation et analyse des prédictions
            liveMatches = result.response.map(item => {
                const homeGoals = item.goals.home || 0;
                const awayGoals = item.goals.away || 0;
                const totalGoals = homeGoals + awayGoals;
                const homeName = item.teams.home.name;
                const awayName = item.teams.away.name;

                // Logique de prédiction intelligente selon le score et le temps
                let predictionAdvice = "";
                let proba = 60;

                if (homeGoals > awayGoals) {
                    predictionAdvice = `Victoire ou Nul pour ${homeName}`;
                    proba = Math.min(88, 65 + (homeGoals - awayGoals) * 10);
                } else if (awayGoals > homeGoals) {
                    predictionAdvice = `Victoire ou Nul pour ${awayName}`;
                    proba = Math.min(88, 65 + (awayGoals - homeGoals) * 10);
                } else {
                    if (totalGoals >= 2) {
                        predictionAdvice = "Plus de 2.5 Buts dans le match";
                        proba = 72;
                    } else {
                        predictionAdvice = "Moins de 3.5 Buts / Match Serré";
                        proba = 68;
                    }
                }

                return {
                    team1: homeName,
                    team2: awayName,
                    league: item.league.name,
                    country: item.league.country,
                    score: `${homeGoals} - ${awayGoals}`,
                    time: `${item.fixture.status.elapsed || 0}'`,
                    proba: proba,
                    advice: predictionAdvice
                };
            });

            renderMatches(liveMatches);

        } catch (error) {
            console.error(error);
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center;'>Erreur de connexion à l'API. Vérifiez votre clé ou votre réseau.</p>";
        }
    }

    function renderMatches(data) {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        data.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <h3>${m.team1} <span style="color:var(--warning-color);">${m.score}</span> ${m.team2}</h3>
                <p>🏆 ${m.league} (${m.country}) | Temps : <strong>${m.time}</strong></p>
                <p>🎯 <strong>Conseil Robot :</strong> <span style="color:var(--accent-color); font-weight:bold;">${m.advice}</span></p>
                <p>Indice de confiance : <strong>${m.proba}%</strong></p>
                <span class="badge ${m.proba > 70 ? 'badge-green' : 'badge-yellow'}">${m.proba > 70 ? 'Pari Fort' : 'Pari Modéré'}</span>
            `;
            container.appendChild(card);
        });
    }

    function filterMatches() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const filtered = liveMatches.filter(m => 
            m.team1.toLowerCase().includes(search) || 
            m.team2.toLowerCase().includes(search) ||
            m.league.toLowerCase().includes(search)
        );
        renderMatches(filtered);
    }

    function generateFifaCoupon() {
        const resultDiv = document.getElementById('fifa-coupon-result');
        const team1 = fifaTeams[Math.floor(Math.random() * fifaTeams.length)];
        let team2 = fifaTeams[Math.floor(Math.random() * fifaTeams.length)];
        while (team1 === team2) team2 = fifaTeams[Math.floor(Math.random() * fifaTeams.length)];

        resultDiv.innerHTML = `
            <div style="background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left;">
                <h3 style="color: var(--success-color); margin-top:0;">🤖 Pronostic FIFA Virtuel</h3>
                <p><strong>Match :</strong> ${team1} vs ${team2}<br>
                   👉 <strong>Conseil :</strong> Plus de 2.5 Buts dans le match (82% de confiance)</p>
            </div>
        `;
    }

    function calculateKelly() {
        const b = parseFloat(document.getElementById('bankroll').value);
        const o = parseFloat(document.getElementById('odd').value);
        const p = parseFloat(document.getElementById('probability').value) / 100;

        if (!b || !o || !p) {
            document.getElementById('kelly-result').innerHTML = "<p style='color:var(--danger-color)'>Veuillez remplir tous les champs.</p>";
            return;
        }

        const q = 1 - p;
        const bDecimal = o - 1;
        const kellyFraction = ((bDecimal * p) - q) / bDecimal;

        if (kellyFraction <= 0) {
            document.getElementById('kelly-result').innerHTML = "<p style='color:var(--warning-color)'>Pari non recommandé.</p>";
        } else {
            const stake = (b * kellyFraction * 0.5).toFixed(2);
            document.getElementById('kelly-result').innerHTML = `<p style='color:var(--success-color)'>Mise conseillée : <strong>${stake} €</strong></p>`;
        }
    }

    fetchRealMatches();
</script>
