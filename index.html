<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot OMEGA PRO - Générateur de Combinés</title>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --neon-blue: #38bdf8;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .btn-search {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn-add {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .match-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .match-details {
            flex: 1;
        }

        .team-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        #ticket-result {
            display: none;
            background: #0f172a;
            border: 2px solid var(--accent-green);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
        }

        #ticket-result h3 {
            margin-top: 0;
            color: var(--accent-green);
            font-size: 1.1rem;
            text-align: center;
        }

        .ticket-item {
            background: var(--card-bg);
            border-left: 4px solid var(--neon-blue);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .badge-win { background-color: #059669; color: white; }
        .badge-dc { background-color: #d97706; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT OMEGA PRO</h1>
        <span style="color:var(--accent-green); font-size: 0.8rem;">GÉNÉRATEUR DE COMBINÉS</span>
    </div>

    <!-- BOUTON DE RECHERCHE -->
    <button class="btn-search" onclick="rechercherMatchsDuJour()">🔍 Rechercher les matchs disponibles</button>

    <!-- SAISIE MANUELLE SI BESOIN -->
    <div class="input-group">
        <input type="text" id="nom-match" placeholder="Ou ajoute un match : ex: PSG vs Lyon">
        <button class="btn-add" onclick="ajouterMatchManuel()">+ Ajouter</button>
    </div>

    <!-- LISTE DES MATCHS -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--neon-blue);">⚽ Coche les matchs pour le combiné</h3>
        
        <div id="matches-list">
            <p style="color: var(--text-muted); text-align: center;">Clique sur "Rechercher" ou ajoute tes matchs manuellement.</p>
        </div>

        <button class="action-btn" onclick="genererTicketCombine()">🎯 Générer le Ticket Combiné par le Robot</button>
    </div>

    <!-- TICKET DE COMBINÉ -->
    <div id="ticket-result">
        <h3>🎫 Ticket Combiné Conseillé par le Robot</h3>
        <div id="ticket-items"></div>
    </div>
</div>

<script>
    let compteur = 0;

    // 1. Fonction de Recherche intégrée
    function rechercherMatchsDuJour() {
        const matchsExemples = [
            "Real Madrid vs FC Barcelone",
            "Arsenal vs Chelsea",
            "Bayern Munich vs Dortmund",
            "PSG vs Marseille",
            "Inter Milan vs AC Milan"
        ];

        const container = document.getElementById('matches-list');
        container.innerHTML = '';

        matchsExemples.forEach(match => {
            creerCarteMatch(match, true);
        });
    }

    // 2. Fonction d'ajout manuel
    function ajouterMatchManuel() {
        const input = document.getElementById('nom-match');
        const text = input.value.trim();
        if (text !== "") {
            // Efface le message par défaut s'il est là
            const container = document.getElementById('matches-list');
            if (container.querySelector('p')) {
                container.innerHTML = '';
            }
            creerCarteMatch(text, true);
            input.value = "";
        }
    }

    // Création de l'élément HTML pour le match
    function creerCarteMatch(nom, cocher = false) {
        compteur++;
        const id = 'match_' + compteur;
        const container = document.getElementById('matches-list');

        const div = document.createElement('div');
        div.className = 'match-card';
        div.innerHTML = `
            <input type="checkbox" class="match-checkbox" value="${nom}" id="${id}" ${cocher ? 'checked' : ''}>
            <div class="match-details">
                <label for="${id}" class="team-title">${nom}</label>
            </div>
        `;
        container.appendChild(div);
    }

    // 3. Moteur de calcul du Robot pour le combiné
    function genererTicketCombine() {
        const checkboxes = document.querySelectorAll('.match-checkbox:checked');
        
        if (checkboxes.length < 2) {
            alert("Veuillez cocher au moins 2 matchs pour créer un combiné !");
            return;
        }

        const ticketItems = document.getElementById('ticket-items');
        ticketItems.innerHTML = '';

        checkboxes.forEach((cb) => {
            const nomMatch = cb.value;
            
            // Calcul propre au robot (estimation dynamique de probabilité)
            const probaVictoire = Math.floor(Math.random() * (76 - 54 + 1)) + 54;
            const probaDoubleChance = probaVictoire + Math.floor(Math.random() * (16 - 10 + 1)) + 10;

            let typePari = "";
            let badgeClass = "";
            let pourcentageAffiche = 0;

            // Logique stricte : Victoire Cash vs Double Chance
            if (probaVictoire >= 67) {
                typePari = "Victoire Cash (1 ou 2)";
                badgeClass = "badge-win";
                pourcentageAffiche = probaVictoire;
            } else {
                typePari = "Double Chance (1X ou X2)";
                badgeClass = "badge-dc";
                pourcentageAffiche = probaDoubleChance;
            }

            const div = document.createElement('div');
            div.className = 'ticket-item';
            div.innerHTML = `
                <div><strong>Match :</strong> ${nomMatch}</div>
                <div><strong>Pronostic Robot :</strong> <span class="badge ${badgeClass}">${typePari}</span></div>
                <div style="margin-top: 4px; color: var(--text-muted);">Confiance calculée : <strong>${pourcentageAffiche}%</strong></div>
            `;
            ticketItems.appendChild(div);
        });

        document.getElementById('ticket-result').style.display = 'block';
        document.getElementById('ticket-result').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
