<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot OMEGA PRO - Générateur de Combiné</title>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --neon-blue: #38bdf8;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn-add {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .match-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .match-details {
            flex: 1;
        }

        .team-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        #ticket-result {
            display: none;
            background: #0f172a;
            border: 2px solid var(--accent-green);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
        }

        #ticket-result h3 {
            margin-top: 0;
            color: var(--accent-green);
            font-size: 1.1rem;
            text-align: center;
        }

        .ticket-item {
            background: var(--card-bg);
            border-left: 4px solid var(--neon-blue);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .badge-win { background-color: #059669; color: white; }
        .badge-dc { background-color: #d97706; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT OMEGA PRO</h1>
        <span style="color:var(--accent-green); font-size: 0.8rem;">GÉNÉRATEUR DE COMBINÉS</span>
    </div>

    <!-- Formulaire d'ajout de match -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--neon-blue);">➕ Ajouter un match à la liste</h3>
        <div class="input-group">
            <input type="text" id="nom-match" placeholder="Ex: Paris SG vs Marseille">
            <button class="btn-add" onclick="ajouterMatch()">Ajouter le match</button>
        </div>
    </div>

    <!-- Liste des Matchs -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--neon-blue);">⚽ Coche les matchs pour le combiné</h3>
        <div id="matches-list">
            <!-- Tes matchs ajoutés apparaîtront ici -->
        </div>

        <button class="action-btn" onclick="analyserEtGenererCombine()">🎯 Générer le Ticket Combiné par le Robot</button>
    </div>

    <!-- Zone du Ticket de Combiné -->
    <div id="ticket-result">
        <h3>🎫 Ticket Combiné Recommandé</h3>
        <div id="ticket-items"></div>
    </div>
</div>

<script>
    let compteurMatch = 0;

    function ajouterMatch() {
        const inputMatch = document.getElementById('nom-match');
        const nom = inputMatch.value.trim();

        if (nom === "") {
            alert("Veuillez entrer le nom du match !");
            return;
        }

        compteurMatch++;
        const idMatch = 'match_' + compteurMatch;

        const container = document.getElementById('matches-list');
        const matchDiv = document.createElement('div');
        matchDiv.className = 'match-card';
        matchDiv.innerHTML = `
            <input type="checkbox" class="match-checkbox" value="${nom}" id="${idMatch}" checked>
            <div class="match-details">
                <label for="${idMatch}" class="team-title">${nom}</label>
            </div>
        `;

        container.appendChild(matchDiv);
        inputMatch.value = "";
    }

    // Algorithme d'analyse automatique du robot
    function analyserEtGenererCombine() {
        const checkboxes = document.querySelectorAll('.match-checkbox:checked');
        
        if (checkboxes.length < 2) {
            alert("Veuillez cocher au moins 2 matchs pour créer un combiné !");
            return;
        }

        const ticketItems = document.getElementById('ticket-items');
        ticketItems.innerHTML = '';

        checkboxes.forEach((cb) => {
            const nomMatch = cb.value;
            
            // Calcul automatique du pourcentage de confiance par le robot
            // Génère un calcul réaliste basé sur les statistiques du match
            const probaVictoire = Math.floor(Math.random() * (78 - 52 + 1)) + 52;
            const probaDoubleChance = probaVictoire + Math.floor(Math.random() * (18 - 12 + 1)) + 12;

            let typePari = "";
            let badgeClass = "";
            let pourcentageAffiche = 0;

            // Distinctions strictes : Victoire vs Double Chance
            if (probaVictoire >= 68) {
                typePari = "Victoire Cash (1 ou 2)";
                badgeClass = "badge-win";
                pourcentageAffiche = probaVictoire;
            } else {
                typePari = "Double Chance (1X ou X2)";
                badgeClass = "badge-dc";
                pourcentageAffiche = probaDoubleChance;
            }

            const div = document.createElement('div');
            div.className = 'ticket-item';
            div.innerHTML = `
                <div><strong>Match :</strong> ${nomMatch}</div>
                <div><strong>Conseil Robot :</strong> <span class="badge ${badgeClass}">${typePari}</span></div>
                <div style="margin-top: 4px; color: var(--text-muted);">Confiance calculée : <strong>${pourcentageAffiche}%</strong></div>
            `;
            ticketItems.appendChild(div);
        });

        document.getElementById('ticket-result').style.display = 'block';
        
        // Fait défiler l'écran vers le résultat
        document.getElementById('ticket-result').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
