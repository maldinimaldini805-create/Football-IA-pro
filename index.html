<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Pronostics - Combinés</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .match-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; }
        .btn-combine { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn-combine:hover { background-color: #218838; }
        #ticket-result { margin-top: 25px; padding: 15px; background: #e9ecef; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>Matchs Disponibles</h2>
    <div id="liste-matchs">
        <!-- Exemple de structure de match générée -->
        <div class="match-card">
            <div>
                <input type="checkbox" class="match-checkbox" value="MATCH_001" id="m1">
                <label for="m1"><strong>Real Madrid vs FC Barcelone</strong></label>
            </div>
            <span>Probabilité Victoire : 65% | DC : 85%</span>
        </div>

        <div class="match-card">
            <div>
                <input type="checkbox" class="match-checkbox" value="MATCH_002" id="m2">
                <label for="m2"><strong>Arsenal vs Chelsea</strong></label>
            </div>
            <span>Probabilité Victoire : 52% | DC : 78%</span>
        </div>
    </div>

    <!-- Bouton pour déclencher le combiné -->
    <button class="btn-combine" onclick="genererTicketCombine()"> Gagner avec un Combiné</button>

    <!-- Zone d'affichage du combiné -->
    <div id="ticket-result" style="display: none;">
        <h3> Ticket Combiné Recommandé par le Robot</h3>
        <ul id="ticket-items"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
