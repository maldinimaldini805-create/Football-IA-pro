<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot de Prédiction Football 100.0 OMEGA</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b0f19;
            --card-border: #1f2937;
            --text-color: #f9fafb;
            --accent-color: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706, #b45309);
            --neon-blue: #38bdf8;
            --purple-glow: rgba(168, 85, 247, 0.4);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h1 {
            font-size: 2.1rem;
            margin: 0;
            background: linear-gradient(90deg, #f59e0b, #38bdf8, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .version-tag {
            background: var(--gold-gradient);
            color: black;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 900;
            display: inline-block;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
            letter-spacing: 1px;
        }

        /* MENU DÉFILANT CATEGORIES */
        .filter-menu {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .filter-menu::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #9ca3af;
            padding: 10px 18px;
            border-radius: 25px;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: black;
            box-shadow: 0 0 15px var(--accent-glow);
            border-color: var(--accent-color);
        }

        .filter-btn.alert-btn {
            border-color: var(--danger-color);
            color: #f87171;
        }

        .filter-btn.alert-btn.active {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: #030712;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s;
        }

        button.combo-btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--purple-glow);
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        /* TICKET COMBINÉ BANNER */
        .combo-box {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 2px solid #a855f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 0 20px var(--purple-glow);
        }

        .combo-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: #c084fc;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .combo-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #10b981;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 5px solid var(--accent-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .match-teams {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
        }

        .match-score {
            color: var(--warning-color);
            background: #030712;
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-weight: bold;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .stat-box {
            background: #030712;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .stat-title {
            color: #6b7280;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #f9fafb;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .badge-dynamic {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 900;
            margin-top: 15px;
        }

        .badge-alert {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT DE PRÉDICTION <span class="version-tag">v100.0 OMEGA</span></h1>
    </div>

    <!-- MENU FILTRES PAR CATEGORIES -->
    <div class="filter-menu">
        <button class="filter-btn active" onclick="setCategory('all', this)">🌐 Tout (Vue Globale)</button>
        <button class="filter-btn alert-btn" onclick="setCategory('alert', this)">🚨 Alertes Sûres (+85%)</button>
        <button class="filter-btn" onclick="setCategory('main', this)">🏆 Principal & Buts</button>
        <button class="filter-btn" onclick="setCategory('fast', this)">⚡ 1er But & Rapide</button>
        <button class="filter-btn" onclick="setCategory('shots', this)">🎯 Tirs & Corners</button>
        <button class="filter-btn" onclick="setCategory('fouls', this)">🟨 Cartons & Fautes</button>
        <button class="filter-btn" onclick="setCategory('other', this)">🖐️ Touches & Dégagements</button>
    </div>

    <!-- COMMANDES -->
    <div class="card">
        <button class="action-btn" onclick="fetchRealMatches()">⚡ Lancer l'Analyse Algorithmique</button>
        <button class="combo-btn" onclick="generateComboTicket()">🎯 Générer le Combiné Sûr du Jour</button>
        <input type="text" id="search-input" placeholder="🔍 Rechercher une équipe, un pays ou une ligue..." onkeyup="filterMatches()">
    </div>

    <!-- ZONE DU TICKET COMBINÉ -->
    <div id="combo-container" class="combo-box"></div>

    <!-- CONTENEUR DES PRÉDICTIONS -->
    <div id="matches-container">
        <p style="text-align:center; color: #6b7280; padding: 20px;">Cliquez sur le bouton vert ci-dessus pour lancer le scanner.</p>
    </div>
</div>

<script src="config.js"></script>

<script>
    let liveMatches = [];
    let currentCategory = 'all';

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMatches(liveMatches);
    }

    function getTodayDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    async function fetchRealMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = "<p style='text-align:center; color: #f59e0b; padding: 20px;'>🚀 Calcul des probabilités statistiques en cours...</p>";

        if (typeof API_KEY === 'undefined' || !API_KEY || API_KEY === "TA_VRAIE_CLE_API_ICI") {
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center; padding:20px;'>⚠️ Erreur : Clé API non détectée dans <strong>config.js</strong> !</p>";
            return;
        }

        const todayStr = getTodayDate();

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${todayStr}`, {
                "method": "GET",
                "headers": { "x-apisports-key": API_KEY }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = "<p style='text-align:center; color: #6b7280; padding: 20px;'>Aucun événement programmé aujourd'hui.</p>";
                return;
            }

            liveMatches = result.response.map(item => {
                const homeName = item.teams.home.name;
                const awayName = item.teams.away.name;
                const homeGoals = item.goals.home ?? 0;
                const awayGoals = item.goals.away ?? 0;
                const totalGoals = homeGoals + awayGoals;

                // CALCUL AUTOMATIQUE DE POURCENTAGE PAR LE ROBOT
                let calculatedConfidence = 70;
                const diff = Math.abs(homeGoals - awayGoals);
                if (diff >= 2) {
                    calculatedConfidence = 88 + Math.min(diff, 6); // Ex: 90%, 92%
                } else if (diff === 1) {
                    calculatedConfidence = 78 + Math.floor(Math.random() * 6); // 78% à 83%
                } else {
                    calculatedConfidence = 68 + Math.floor(Math.random() * 8); // 68% à 75%
                }

                return {
                    team1: homeName,
                    team2: awayName,
                    league: item.league.name,
                    country: item.league.country,
                    score: `${homeGoals} - ${awayGoals}`,
                    confidencePercent: calculatedConfidence,
                    
                    winner: homeGoals >= awayGoals ? `Double Chance : 1X (${homeName})` : `Double Chance : X2 (${awayName})`,
                    totalGoals: totalGoals >= 2 ? "Plus de 2.5 Buts dans le match" : "Plus de 1.5 Buts dans le match",
                    htWinner: homeGoals >= awayGoals ? `Avantage ${homeName} ou Nul (1ère MT)` : `Avantage ${awayName} ou Nul (1ère MT)`,
                    
                    firstGoal: homeGoals >= awayGoals ? `Premier But : ${homeName}` : `Premier But : ${awayName}`,
                    fastEvent: "Événement 0-5 min : Touche ou Coup franc",

                    shots: "Plus de 8.5 Tirs cadrés au total",
                    corners: "Plus de 7.5 Corners",

                    yellowCards: "Plus de 3.5 Cartons Jaunes",
                    fouls: "Plus de 20.5 Fautes commises",

                    throwIns: "Plus de 32.5 Touches",
                    clearances: "Plus de 15.5 Dégagements"
                };
            });

            renderMatches(liveMatches);

        } catch (error) {
            console.error(error);
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center; padding:20px;'>Erreur lors de la connexion aux données API.</p>";
        }
    }

    function renderMatches(data) {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        let filteredData = data;

        // FILTRE D'ALERTE DES MATCHS SÛRS (+85%)
        if (currentCategory === 'alert') {
            filteredData = data.filter(m => m.confidencePercent >= 85);
        }

        if (filteredData.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: #6b7280; padding: 20px;'>Aucun match trouvé pour cette catégorie ou ce filtre.</p>";
            return;
        }

        filteredData.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';

            let statsHTML = '';

            if (currentCategory === 'all' || currentCategory === 'alert' || currentCategory === 'main') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🏆 Issue du Match (1N2)</div><div class="stat-value">${m.winner}</div></div>
                    <div class="stat-box"><div class="stat-title">⚽ Total de Buts</div><div class="stat-value">${m.totalGoals}</div></div>
                    <div class="stat-box"><div class="stat-title">⏱️ Gagnant 1ère Mi-Temps</div><div class="stat-value">${m.htWinner}</div></div>
                `;
            }

            if (currentCategory === 'all' || currentCategory === 'fast') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🥇 Équipe qui marque le 1er But</div><div class="stat-value">${m.firstGoal}</div></div>
                    <div class="stat-box"><div class="stat-title">⚡ Événement Rapide (0-5 min)</div><div class="stat-value">${m.fastEvent}</div></div>
                `;
            }

            if (currentCategory === 'all' || currentCategory === 'shots') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🎯 Tirs Cadrés Total</div><div class="stat-value">${m.shots}</div></div>
                    <div class="stat-box"><div class="stat-title">🚩 Nombre de Corners</div><div class="stat-value">${m.corners}</div></div>
                `;
            }

            if (currentCategory === 'all' || currentCategory === 'fouls') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🟨 Cartons Jaunes</div><div class="stat-value">${m.yellowCards}</div></div>
                    <div class="stat-box"><div class="stat-title">🛑 Nombre de Fautes</div><div class="stat-value">${m.fouls}</div></div>
                `;
            }

            if (currentCategory === 'all' || currentCategory === 'other') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🖐️ Nombre de Touches</div><div class="stat-value">${m.throwIns}</div></div>
                    <div class="stat-box"><div class="stat-title">🛡️ Dégagements Défensifs</div><div class="stat-value">${m.clearances}</div></div>
                `;
            }

            const badgeClass = m.confidencePercent >= 85 ? "badge-dynamic badge-alert" : "badge-dynamic";
            const alertTag = m.confidencePercent >= 85 ? "🚨 ALERTE MATCH SÛR - " : "🤖 ";

            card.innerHTML = `
                <div class="match-header">
                    <div class="match-teams">${m.team1} vs ${m.team2}</div>
                    <div class="match-score">${m.score}</div>
                </div>
                <div style="font-size:0.8rem; color:#6b7280; margin-bottom:10px;">🏆 ${m.league} (${m.country})</div>
                <div class="grid-stats">${statsHTML}</div>
                <div class="${badgeClass}">${alertTag} Confiance : ${m.confidencePercent}%</div>
            `;

            container.appendChild(card);
        });
    }

    // FONCTION POUR GÉNÉRER UN TICKET COMBINÉ
    function generateComboTicket() {
        const comboBox = document.getElementById('combo-container');
        
        if (liveMatches.length === 0) {
            alert("Veuillez d'abord charger les matchs en cliquant sur le bouton vert !");
            return;
        }

        // Sélection des matchs les plus sûrs (>= 80%)
        const safeMatches = liveMatches.filter(m => m.confidencePercent >= 80).slice(0, 3);

        if (safeMatches.length === 0) {
            comboBox.style.display = 'block';
            comboBox.innerHTML = "<p style='color:#f87171; text-align:center;'>Pas assez de matchs sûrs aujourd'hui pour former un combiné.</p>";
            return;
        }

        let itemsHTML = '';
        safeMatches.forEach(m => {
            itemsHTML += `
                <div class="combo-item">
                    <strong>⚽ ${m.team1} vs ${m.team2}</strong><br>
                    📌 Pronostic : <span style="color:#10b981;">${m.winner}</span> | Confiance : <strong>${m.confidencePercent}%</strong>
                </div>
            `;
        });

        comboBox.style.display = 'block';
        comboBox.innerHTML = `
            <div class="combo-header">
                <span>🔥 TICKET COMBINÉ VIP (${safeMatches.length} ÉVÉNEMENTS)</span>
                <span style="font-size:0.8rem; color:#10b981;">OPTIMISÉ</span>
            </div>
            ${itemsHTML}
        `;
    }

    function filterMatches() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const filtered = liveMatches.filter(m => 
            m.team1.toLowerCase().includes(search) || 
            m.team2.toLowerCase().includes(search) ||
            m.league.toLowerCase().includes(search) ||
            m.country.toLowerCase().includes(search)
        );
        renderMatches(filtered);
    }
</script>

</body>
</html>
