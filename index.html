<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot de Prédiction Football 100.0 OMEGA - Edition Avant-Match & Live</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b0f19;
            --card-border: #1f2937;
            --text-color: #f9fafb;
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --gold-gradient: linear-gradient(135deg, #10b981, #059669, #047857);
            --neon-blue: #38bdf8;
            --fire-gradient: linear-gradient(135deg, #ef4444, #f97316);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-size: 2.1rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .version-tag {
            background: var(--gold-gradient);
            color: white;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 900;
            display: inline-block;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .main-mode-menu {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 900;
            border-radius: 14px;
            border: 2px solid var(--card-border);
            background: var(--card-bg);
            color: #9ca3af;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .mode-btn.active-live {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .mode-btn.active-prematch {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--neon-blue);
            margin-bottom: 10px;
        }

        .inputs-flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .inputs-flex input {
            flex: 1;
            min-width: 140px;
        }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: #030712;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        button.custom-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .combo-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button.combo-btn {
            background: linear-gradient(135deg, #10b981, #047857);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button.big-odds-btn {
            background: var(--fire-gradient);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .combo-box {
            background: linear-gradient(135deg, #064e3b, #0f172a);
            border: 2px solid #10b981;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .combo-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: #34d399;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .combo-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #10b981;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 5px solid #10b981;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .match-teams {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .stat-box {
            background: #030712;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .stat-title {
            color: #6b7280;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #f9fafb;
            font-weight: bold;
            font-size: 0.88rem;
        }

        .export-btn {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT DE PRÉDICTION <span class="version-tag">v100.0 OMEGA</span></h1>
    </div>

    <!-- SÉLECTEUR DE MODE -->
    <div class="main-mode-menu">
        <button id="btn-mode-prematch" class="mode-btn active-prematch" onclick="switchMainMode('prematch')">📅 AVANT-MATCH (A VENIR)</button>
        <button id="btn-mode-live" class="mode-btn" onclick="switchMainMode('live')">🔴 MATCHS EN DIRECT</button>
    </div>

    <!-- MODULE AVANT-MATCH (AJOUT ET COMBINÉS RAPIDES) -->
    <div id="section-prematch" class="card">
        <div class="card-title">⚡ Ajouter un Match A Venir pour Analyse Rapide</div>
        <div class="inputs-flex">
            <input type="text" id="custom-team1" placeholder="Équipe Domicile (ex: Real Madrid)">
            <input type="text" id="custom-team2" placeholder="Équipe Extérieur (ex: Barcelona)">
        </div>
        <button class="custom-btn" onclick="predictCustomMatch()">🔍 Analyser & Ajouter la Prédiction</button>
    </div>

    <!-- CONTROLES DES COMBINÉS -->
    <div class="card">
        <div class="card-title">🎯 Générateur de Ticket Combiné Instantané</div>
        <div class="combo-buttons-grid">
            <button class="combo-btn" onclick="generateComboTicket(3)">🛡️ Combiné Sécurisé (3 Matchs)</button>
            <button class="big-odds-btn" onclick="generateComboTicket(5)">🚀 Combiné Étendu (5 Matchs)</button>
        </div>
    </div>

    <!-- AFFICHAGE DU COMBINÉ -->
    <div id="combo-container" class="combo-box"></div>

    <!-- LISTE DES PRÉDICTIONS -->
    <div id="matches-container">
        <p style="text-align:center; color: #6b7280; padding: 20px;">Ajoutez des matchs avant-coup d'envoi ci-dessus pour générer vos combinaisons.</p>
    </div>
</div>

<script>
    let prematchMatches = [];
    let liveMatches = [];
    let currentMainMode = 'prematch';

    function switchMainMode(mode) {
        currentMainMode = mode;
        const liveBtn = document.getElementById('btn-mode-live');
        const prematchBtn = document.getElementById('btn-mode-prematch');
        const sectionPrematch = document.getElementById('section-prematch');

        if (mode === 'prematch') {
            prematchBtn.className = "mode-btn active-prematch";
            liveBtn.className = "mode-btn";
            sectionPrematch.classList.remove('hidden');
            renderMatches(prematchMatches);
        } else {
            liveBtn.className = "mode-btn active-live";
            prematchBtn.className = "mode-btn";
            sectionPrematch.classList.add('hidden');
            renderMatches(liveMatches);
        }
    }

    // ALGORITHME DE CALCUL DES PROBABILITÉS AVANT-MATCH
    function buildUltraPrecisePrediction(t1, t2) {
        // Simulation d'analyse basée sur l'historique et la confrontation
        const hash = (t1 + t2).length;
        const probHome = Math.min(75, Math.max(25, 45 + (hash % 20)));
        const probAway = Math.min(70, Math.max(20, 35 - (hash % 15)));
        const probDraw = 100 - (probHome + probAway);

        const calculatedConfidence = parseFloat((Math.max(probHome, probAway) + (probDraw * 0.4)).toFixed(1));

        let straightWinner = "";
        let doubleChanceOpt = "";

        if (probHome > probAway) {
            straightWinner = `Victoire Ferme : 1 (${t1})`;
            doubleChanceOpt = `Double Chance : 1X (${t1} ou Nul)`;
        } else {
            straightWinner = `Victoire Ferme : 2 (${t2})`;
            doubleChanceOpt = `Double Chance : X2 (${t2} ou Nul)`;
        }

        return {
            team1: t1,
            team2: t2,
            confidencePercent: calculatedConfidence,
            odd: (1.25 + (hash % 5) * 0.1).toFixed(2),
            winnerChoice: straightWinner,
            doubleChance: doubleChanceOpt,
            g15: "Plus de 1.5 Buts",
            g25: "Plus de 2.5 Buts",
            corners: "Plus de 8.5 Corners",
            fouls: "Plus de 20.5 Fautes"
        };
    }

    function predictCustomMatch() {
        const t1 = document.getElementById('custom-team1').value.trim();
        const t2 = document.getElementById('custom-team2').value.trim();

        if (!t1 || !t2) {
            alert("Veuillez saisir le nom des deux équipes.");
            return;
        }

        const match = buildUltraPrecisePrediction(t1, t2);
        prematchMatches.unshift(match);
        
        document.getElementById('custom-team1').value = '';
        document.getElementById('custom-team2').value = '';
        
        renderMatches(prematchMatches);
    }

    function renderMatches(data) {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = `<p style='text-align:center; color: #6b7280; padding: 20px;'>Aucun match disponible dans ce mode.</p>`;
            return;
        }

        data.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <div class="match-header">
                    <div class="match-teams">⚽ ${m.team1} vs ${m.team2}</div>
                    <div style="color:#10b981; font-weight:bold;">Confiance : ${m.confidencePercent}%</div>
                </div>
                <div class="grid-stats">
                    <div class="stat-box"><div class="stat-title">Victoire Directe</div><div class="stat-value">${m.winnerChoice}</div></div>
                    <div class="stat-box"><div class="stat-title">Double Chance (Sécurité)</div><div class="stat-value">${m.doubleChance}</div></div>
                    <div class="stat-box"><div class="stat-title">Buts</div><div class="stat-value">${m.g15}</div></div>
                    <div class="stat-box"><div class="stat-title">Discipline & Corners</div><div class="stat-value">${m.corners}</div></div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // GENERATION RAPIDE DE COMBINÉ SUR MATCHS AVANT-MATCH
    function generateComboTicket(count) {
        const comboBox = document.getElementById('combo-container');
        const dataToUse = currentMainMode === 'prematch' ? prematchMatches : liveMatches;

        if (dataToUse.length === 0) {
            alert("Ajoutez d'abord quelques matchs avant-coup d'envoi pour générer le combiné !");
            return;
        }

        const selected = dataToUse.slice(0, count);
        let totalOdd = 1.0;
        let itemsHTML = '';

        selected.forEach(m => {
            const matchOdd = parseFloat(m.odd);
            totalOdd *= matchOdd;
            itemsHTML += `
                <div class="combo-item">
                    <strong>⚽ ${m.team1} vs ${m.team2}</strong><br>
                    📌 Pronostic Sécurisé : <span style="color:#10b981;">${m.doubleChance}</span><br>
                    📊 Indice Calculé : <strong>${m.confidencePercent}%</strong> | Cote : ${m.odd}
                </div>
            `;
        });

        comboBox.style.display = 'block';
        comboBox.innerHTML = `
            <div id="ticket-capture">
                <div class="combo-header">
                    <span>⚡ COMBINÉ SÉLECTIONNÉ (${selected.length} MATCHS)</span>
                    <span>COTE TOTALE : <strong>${totalOdd.toFixed(2)}</strong></span>
                </div>
                ${itemsHTML}
            </div>
            <button class="export-btn" onclick="downloadTicketImage()">📸 Télécharger le Ticket en Image</button>
        `;
    }

    function downloadTicketImage() {
        const element = document.getElementById('ticket-capture');
        html2canvas(element, { backgroundColor: '#0b0f19' }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'combine-avant-match.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
