<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot OMEGA PRO - Générateur de Combiné</title>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --neon-blue: #38bdf8;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-blue);
        }

        .btn-add {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .match-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .match-details {
            flex: 1;
        }

        .team-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        #ticket-result {
            display: none;
            background: #0f172a;
            border: 2px solid var(--accent-orange);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
        }

        #ticket-result h3 {
            margin-top: 0;
            color: var(--accent-orange);
            font-size: 1.1rem;
            text-align: center;
        }

        .ticket-item {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-green);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT OMEGA PRO</h1>
        <span style="color:var(--accent-green); font-size: 0.8rem;">GÉNÉRATEUR DE COMBINÉS</span>
    </div>

    <!-- Formulaire d'ajout d'équipe -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--neon-blue);">➕ Ajouter un match à la liste</h3>
        <div class="input-group">
            <input type="text" id="nom-match" placeholder="Ex: Paris SG vs Marseille">
            <button class="btn-add" onclick="ajouterMatch()">Ajouter le match</button>
        </div>
    </div>

    <!-- Liste des Matchs disponibles -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--neon-blue);">⚽ Coche les matchs pour le combiné</h3>
        <div id="matches-list">
            <!-- Les matchs ajoutés apparaîtront ici -->
        </div>

        <button class="action-btn" onclick="genererTicketCombine()">🎯 Générer le Ticket Combiné par le Robot</button>
    </div>

    <!-- Zone du Ticket de Combiné -->
    <div id="ticket-result">
        <h3>🎫 Ticket Combiné Conseillé</h3>
        <div id="ticket-items"></div>
    </div>
</div>

<script>
    let compteurMatch = 0;

    function ajouterMatch() {
        const inputMatch = document.getElementById('nom-match');
        const nom = inputMatch.value.trim();

        if (nom === "") {
            alert("Veuillez saisir le nom des équipes (Ex: Real Madrid vs Barcelone)");
            return;
        }

        compteurMatch++;
        const idMatch = 'match_' + compteurMatch;

        const container = document.getElementById('matches-list');
        const matchDiv = document.createElement('div');
        matchDiv.className = 'match-card';
        matchDiv.innerHTML = `
            <input type="checkbox" class="match-checkbox" value="${nom}" id="${idMatch}">
            <div class="match-details">
                <label for="${idMatch}" class="team-title">${nom}</label>
            </div>
        `;

        container.appendChild(matchDiv);
        inputMatch.value = ""; // Réinitialiser le champ texte
    }

    async function genererTicketCombine() {
        const checkboxes = document.querySelectorAll('.match-checkbox:checked');
        const matchsSelectionnes = [];

        checkboxes.forEach(cb => {
            matchsSelectionnes.push(cb.value);
        });

        if (matchsSelectionnes.length < 2) {
            alert("Veuillez cocher au moins 2 matchs pour que le robot génère un combiné !");
            return;
        }

        try {
            const response = await fetch('/api/combine', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ matchs: matchsSelectionnes })
            });

            const data = await response.json();
            
            if (data.status === 'success') {
                afficherTicket(data.combine);
            }
        } catch (erreur) {
            console.error("Erreur de connexion avec le robot Python:", erreur);
        }
    }

    function afficherTicket(combineData) {
        const container = document.getElementById('ticket-result');
        const list = document.getElementById('ticket-items');
        list.innerHTML = '';

        combineData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'ticket-item';
            div.innerHTML = `
                <div><strong>Match :</strong> ${item.match}</div>
                <div><strong>Choix Robot :</strong> <span style="color:var(--accent-green);">${item.choix}</span></div>
                <div><strong>Confiance calculée :</strong> ${item.pourcentage}%</div>
            `;
            list.appendChild(div);
        });

        container.style.display = 'block';
    }
</script>

</body>
</html>
