<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot de Prédiction - Championnats & Compétitions</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --text-muted: #94a3b8;
            --badge-bg: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        .header-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        /* ONGLETS PRINCIPAUX : EN DIRECT / AVANT-MATCH */
        .top-tabs {
            display: flex;
            background: #1e293b;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 12px;
        }

        .top-tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .top-tab-btn.active {
            background: var(--accent-orange);
            color: #000000;
        }

        /* FILTRES TEMPORELS */
        .time-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .time-filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .time-filter-btn.active {
            background: var(--accent-orange);
            color: #000;
            border-color: var(--accent-orange);
        }

        /* LISTE DES CHAMPIONNATS */
        .leagues-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .league-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .league-card:hover {
            background: #253346;
        }

        .league-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .league-icon {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .league-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .league-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .match-count-badge {
            background: var(--badge-bg);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 3px 9px;
            border-radius: 12px;
        }

        .fav-star {
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .fav-star.active {
            color: var(--accent-orange);
        }

        /* NAVIGATION INFÉRIEURE */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--accent-orange);
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        /* BOUTON COUPON CENTRAL FLOTTANT */
        .coupon-btn-container {
            position: relative;
            top: -15px;
        }

        .coupon-fab {
            background: var(--accent-orange);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
            font-size: 1.4rem;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">Championnats</div>

    <!-- ONGLETS HAUT : EN DIRECT / AVANT-MATCH -->
    <div class="top-tabs">
        <button class="top-tab-btn" onclick="switchTopTab('live', this)">EN DIRECT</button>
        <button class="top-tab-btn active" onclick="switchTopTab('prematch', this)">Avant-match</button>
    </div>

    <!-- FILTRES DE TEMPS -->
    <div class="time-filters">
        <button class="time-filter-btn active" onclick="filterTime('all', this)">Tout</button>
        <button class="time-filter-btn" onclick="filterTime('15', this)">15 Drive</button>
        <button class="time-filter-btn" onclick="filterTime('30', this)">30 minutes</button>
        <button class="time-filter-btn" onclick="filterTime('60', this)">1 heure</button>
    </div>

    <!-- LISTE DES CHAMPIONNATS (DONNÉES EXTRAITES DE VOTRE CAPTURE) -->
    <div class="leagues-list" id="leagues-container">
        <!-- Généré dynamiquement en JS -->
    </div>
</div>

<!-- BARRE DE NAVIGATION INFÉRIEURE -->
<div class="bottom-nav">
    <div class="nav-item active">
        <div class="nav-icon">🔥</div>
        <div>Populaire</div>
    </div>
    <div class="nav-item">
        <div class="nav-icon">⭐</div>
        <div>Favoris</div>
    </div>
    <div class="coupon-btn-container">
        <div class="coupon-fab">🎟️</div>
    </div>
    <div class="nav-item">
        <div class="nav-icon">🕒</div>
        <div>Historique</div>
    </div>
    <div class="nav-item">
        <div class="nav-icon">⣿</div>
        <div>Menu</div>
    </div>
</div>

<script>
    // Liste des championnats de la capture d'écran
    const leaguesData = [
        { name: "Paris spéciaux du jour", count: 1, icon: "🌍", isHot: false },
        { name: "Supercoupe de l'UEFA", count: 1, icon: "🇪🇺", isHot: true },
        { name: "Ligue des nations de l'UEFA", count: 50, icon: "🇪🇺", isHot: true },
        { name: "Ligue des champions de l'UEFA", count: 14, icon: "🏆", isHot: false },
        { name: "Ligue Europa de l'UEFA", count: 15, icon: "🏆", isHot: false },
        { name: "Ligue Conférence de l'UEFA", count: 15, icon: "🇪🇺", isHot: false },
        { name: "Copa Libertadores", count: 8, icon: "🌍", isHot: false },
        { name: "Copa Sudamericana", count: 8, icon: "🌍", isHot: false },
        { name: "Coupe d'Asie du Sud-Est", count: 4, icon: "🌍", isHot: false },
        { name: "CONCACAF U20", count: 2, icon: "🌍", isHot: false }
    ];

    function renderLeagues() {
        const container = document.getElementById('leagues-container');
        container.innerHTML = '';

        leaguesData.forEach((league, index) => {
            const card = document.createElement('div');
            card.className = 'league-card';
            card.onclick = () => selectLeague(league.name);

            card.innerHTML = `
                <div class="league-left">
                    <div class="league-icon">${league.icon}</div>
                    <div class="league-name">${league.name}</div>
                </div>
                <div class="league-right">
                    <div class="match-count-badge">${league.count}</div>
                    <div class="fav-star" onclick="toggleFavorite(event, this)">☆</div>
                </div>
            `;

            container.appendChild(card);
        });
    }

    function switchTopTab(tab, btn) {
        document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Logique de changement d'affichage (Direct vs Avant-match)
    }

    function filterTime(filter, btn) {
        document.querySelectorAll('.time-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Logique de filtrage temporel
    }

    function toggleFavorite(event, element) {
        event.stopPropagation(); // Empêche l'ouverture du championnat lors du clic sur l'étoile
        element.classList.toggle('active');
        if (element.classList.contains('active')) {
            element.textContent = '★';
        } else {
            element.textContent = '☆';
        }
    }

    function selectLeague(leagueName) {
        alert("Analyse et génération de combiné pour : " + leagueName);
    }

    // Initialisation
    renderLeagues();
</script>

</body>
</html>
