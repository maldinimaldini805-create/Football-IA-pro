<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot OMEGA PRO v1000.9 - Mode LIVE & Scénarios</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --neon-blue: #38bdf8;
            --accent-red: #ef4444;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .version-tag {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 4px;
            font-weight: bold;
        }

        /* ONGLETS AVANT-MATCH / LIVE */
        .mode-tabs {
            display: flex;
            background: #1e293b;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 12px;
        }

        .mode-tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .mode-tab-btn.active {
            background: var(--accent-orange);
            color: #000;
        }

        .mode-tab-btn.live-active {
            background: var(--accent-red);
            color: #fff;
        }

        .update-banner {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .update-badge {
            background: var(--neon-blue);
            color: #000;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--neon-blue);
            margin-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }

        .section-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-top: 6px;
            grid-column: 1 / -1;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .match-header-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .team-name {
            font-size: 0.9rem;
            font-weight: bold;
            flex: 1;
        }

        .match-time-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
            border: 1px solid var(--accent-orange);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .match-time-badge.live {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .scenario-box {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid var(--neon-blue);
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .stat-box {
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.82rem;
            font-weight: bold;
            margin-top: 3px;
            color: #ffffff;
        }

        .stat-value.highlight {
            color: var(--accent-green);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT OMEGA PRO</h1>
        <span class="version-tag">VERSION v1000.9 ULTIMATE</span>
    </div>

    <!-- SELECTION DU MODE -->
    <div class="mode-tabs">
        <button class="mode-tab-btn active" id="tab-prematch" onclick="setMatchMode('prematch')">📋 Avant-Match</button>
        <button class="mode-tab-btn" id="tab-live" onclick="setMatchMode('live')">🔴 Direct LIVE</button>
    </div>

    <div class="update-banner">
        <div>🔄 Moteur IA v1000.9 : <strong id="days-left">7 jours</strong></div>
        <div class="update-badge" onclick="forceWeeklyUpdate()">Recharger IA</div>
    </div>

    <!-- FORMULAIRE -->
    <div class="card">
        <div class="card-title" id="form-title">⚽ Saisir un Match (Avant-Match)</div>
        <div class="form-grid">
            <div class="section-label">Équipes</div>
            <input type="text" id="input-team1" placeholder="Domicile (ex: PSG)">
            <input type="text" id="input-team2" placeholder="Extérieur (ex: Marseille)">

            <!-- CHAMPS SPÉCIFIQUES AU LIVE -->
            <div class="section-label id-live-fields" style="display:none; color:var(--accent-red);">🔴 Paramètres En Direct (v1000.9)</div>
            <input type="number" id="input-minute" placeholder="Minute du match (ex: 55)" style="display:none;" class="id-live-fields">
            <input type="text" id="input-score" placeholder="Score actuel (ex: 1-0)" style="display:none;" class="id-live-fields">
            <select id="input-redcard" style="display:none;" class="id-live-fields">
                <option value="none">Aucun Carton Rouge</option>
                <option value="home">Carton Rouge Équipe 1</option>
                <option value="away">Carton Rouge Équipe 2</option>
            </select>

            <div class="section-label">Cotes 1X2</div>
            <input type="number" step="0.01" id="input-cote1" placeholder="Cote 1">
            <input type="number" step="0.01" id="input-coteX" placeholder="Cote X">
            <input type="number" step="0.01" id="input-cote2" placeholder="Cote 2">

            <div class="section-label">Statistiques Estimées</div>
            <input type="number" step="0.1" id="input-buts" placeholder="Moy. Buts (ex: 2.8)">
            <input type="number" step="0.1" id="input-corners" placeholder="Moy. Corners (ex: 9.5)">
            <input type="number" step="0.1" id="input-cartons" placeholder="Moy. Cartons (ex: 4.2)">
        </div>
        <button class="action-btn" onclick="addAndPredictMatch()">🧠 Calculer les Prédictions & Le Scénario v1000.9</button>
    </div>

    <div id="matches-container"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active"><div>🔥</div><div>Pronos</div></div>
    <div class="nav-item"><div>📊</div><div>Précision IA</div></div>
    <div class="nav-item"><div>⚙️</div><div>Paramètres</div></div>
</div>

<script>
    let currentMode = 'prematch';
    let matchesList = [];

    function setMatchMode(mode) {
        currentMode = mode;
        const btnPre = document.getElementById('tab-prematch');
        const btnLive = document.getElementById('tab-live');
        const liveFields = document.querySelectorAll('.id-live-fields');
        const formTitle = document.getElementById('form-title');

        if (mode === 'live') {
            btnPre.className = 'mode-tab-btn';
            btnLive.className = 'mode-tab-btn live-active';
            liveFields.forEach(el => el.style.display = 'block');
            formTitle.textContent = "🔴 Saisir un Match EN DIRECT (LIVE v1000.9)";
        } else {
            btnPre.className = 'mode-tab-btn active';
            btnLive.className = 'mode-tab-btn';
            liveFields.forEach(el => el.style.display = 'none');
            formTitle.textContent = "⚽ Saisir un Match (Avant-Match v1000.9)";
        }
    }

    function initWeeklyUpdateCycle() {
        let lastUpdate = localStorage.getItem('omega_last_update');
        const now = new Date().getTime();
        const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;

        if (!lastUpdate) {
            localStorage.setItem('omega_last_update', now);
            lastUpdate = now;
        }

        const nextUpdate = parseInt(lastUpdate) + sevenDaysInMs;
        const diffMs = nextUpdate - now;
        const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

        if (daysLeft <= 0) {
            forceWeeklyUpdate();
        } else {
            document.getElementById('days-left').textContent = daysLeft + " jour(s)";
        }
    }

    function forceWeeklyUpdate() {
        localStorage.setItem('omega_last_update', new Date().getTime());
        document.getElementById('days-left').textContent = "7 jours";
        alert("🤖 MISE À JOUR EFFECTUÉE !\nL'algorithme IA v1000.9 s'est réajusté pour la nouvelle période de 7 jours.");
    }

    function addAndPredictMatch() {
        const t1 = document.getElementById('input-team1').value.trim();
        const t2 = document.getElementById('input-team2').value.trim();
        
        const rawC1 = document.getElementById('input-cote1').value;
        const rawCX = document.getElementById('input-coteX').value;
        const rawC2 = document.getElementById('input-cote2').value;

        const c1 = rawC1 ? parseFloat(rawC1) : 2.10;
        const cX = rawCX ? parseFloat(rawCX) : 3.30;
        const c2 = rawC2 ? parseFloat(rawC2) : 3.40;

        const rawButs = document.getElementById('input-buts').value;
        const rawCorners = document.getElementById('input-corners').value;
        const rawCartons = document.getElementById('input-cartons').value;

        const avgGoals = rawButs ? parseFloat(rawButs) : 2.5;
        const avgCorners = rawCorners ? parseFloat(rawCorners) : 9.0;
        const avgCards = rawCartons ? parseFloat(rawCartons) : 4.0;

        if (!t1 || !t2) {
            alert("Veuillez saisir au moins le nom des deux équipes.");
            return;
        }

        let timeBadge = "Avant-Match";
        let liveScoreStr = "";
        let redCard = document.getElementById('input-redcard').value;

        if (currentMode === 'live') {
            const min = document.getElementById('input-minute').value || "45";
            const score = document.getElementById('input-score').value || "0-0";
            timeBadge = `🔴 LIVE ${min}' (${score})`;
            liveScoreStr = score;
        }

        // Calcul dynamique des probabilités v1000.9
        const prob1 = (1 / c1) * 100;
        const prob2 = (1 / c2) * 100;
        const diffProb = Math.abs(prob1 - prob2);

        // 1. Victoire Directe vs Double Chance
        let issueFerme = "";
        let doubleChance = "";
        
        if (diffProb > 15) {
            if (prob1 > prob2) {
                issueFerme = `Victoire 1 (${t1})`;
                doubleChance = `Double Chance 1X`;
            } else {
                issueFerme = `Victoire 2 (${t2})`;
                doubleChance = `Double Chance X2`;
            }
        } else {
            issueFerme = "Match Équilibré";
            doubleChance = prob1 >= prob2 ? `Double Chance 1X` : `Double Chance X2`;
        }

        // 2. Score Exact ET Total Buts (Cohérence stricte v1000.9)
        let exactScore = "1 - 1";
        let totalGoals = "Moins de 2.5 Buts";
        let htGoals = "Moins de 0.5 But";
        let ftGoals = "Moins de 1.5 But";
        let btts = "NON";

        if (avgGoals >= 2.7) {
            totalGoals = "Plus de 2.5 Buts";
            htGoals = "Plus de 0.5 But";
            ftGoals = "Plus de 1.5 Buts";
            btts = "OUI";

            if (prob1 > prob2 + 10) exactScore = "2 - 1";
            else if (prob2 > prob1 + 10) exactScore = "1 - 2";
            else exactScore = "2 - 2";
        } else {
            totalGoals = "Moins de 2.5 Buts";
            htGoals = "Moins de 0.5 But";
            ftGoals = "Moins de 1.5 But";
            btts = (prob1 > 40 && prob2 > 40) ? "OUI" : "NON";

            if (prob1 > prob2 + 10) exactScore = "1 - 0";
            else if (prob2 > prob1 + 10) exactScore = "0 - 1";
            else exactScore = "0 - 0";
        }

        // 3. Cartons & Fautes
        let cardsPred = avgCards >= 4.5 ? "Plus de 4.5 Cartons" : "Moins de 4.5 Cartons";
        if (redCard !== 'none') cardsPred += " (Carton Rouge en cours)";

        const foulsPred = avgCards >= 4.0 ? "Plus de 23.5 Fautes" : "Moins de 23.5 Fautes";

        // 4. Touches & Dégagements
        const throwIns = "Plus de 33.5 Touches";
        const goalKicks = "Plus de 13.5 Dégagements";
        const cornersPred = avgCorners >= 9.5 ? "Plus de 9.5 Corners" : "Moins de 9.5 Corners";

        // 5. Tirs (Somme 1MT + 2MT = Total)
        let totalShotsVal = avgGoals >= 2.7 ? 24.5 : 20.5;
        let totalShotsTarget = Math.floor(totalShotsVal);
        let htShotsVal = Math.round(totalShotsTarget * 0.45);
        let ftShotsVal = totalShotsTarget - htShotsVal;
        let shotsCadresVal = Math.round(totalShotsTarget * 0.38);

        const shotsDisplay = `+${totalShotsVal} Tirs (+${shotsCadresVal} Cadrés) | 1MT: +${htShotsVal} | 2MT: +${ftShotsVal}`;

        // 6. SCÉNARIO TACTIQUE IA v1000.9
        let scenarioText = "";
        if (currentMode === 'live') {
            scenarioText = `⚡ **Scénario Live v1000.9** : À la minute actuelle (${liveScoreStr}), ${t1} montre une pression constante. `;
            if (redCard === 'home') scenarioText += `L'expulsion subie par ${t1} va pousser ${t2} à monopoliser le ballon et accentuer les tirs en seconde période.`;
            else if (redCard === 'away') scenarioText += `En supériorité numérique, ${t1} devrait dominer la possession et créer plus d'occasions franches.`;
            else scenarioText += `Le match reste ouvert, nous prévoyons au moins 1 but supplémentaire avant le coup de sifflet final.`;
        } else {
            if (prob1 > prob2 + 10) {
                scenarioText = `📝 **Scénario Estimé v1000.9** : ${t1} devrait prendre le contrôle du jeu et ouvrir le score en 1ère mi-temps. ${t2} tentera de réagir en 2ème période avec plus de prises de risque.`;
            } else if (prob2 > prob1 + 10) {
                scenarioText = `📝 **Scénario Estimé v1000.9** : ${t2} imposera un rythme élevé dès l'entame et tentera de marquer rapidement. ${t1} jouera en contre-attaque.`;
            } else {
                scenarioText = `📝 **Scénario Estimé v1000.9** : Match tactique et serré. La première mi-temps s'annonce prudente avec peu d'espaces, l'intensité physique augmentera en 2ème mi-temps.`;
            }
        }

        // Calcul propre du pourcentage de fiabilité (pas de % fixe)
        const maxProb = Math.max(prob1, prob2);
        const confidence = Math.min(98, Math.max(55, Math.round(maxProb + (avgGoals * 4))));

        const matchObj = {
            team1: t1, team2: t2, timeBadge: timeBadge, isLive: currentMode === 'live',
            c1: c1.toFixed(2), cX: cX.toFixed(2), c2: c2.toFixed(2),
            issueFerme: issueFerme, doubleChance: doubleChance,
            totalGoals: totalGoals, htGoals: htGoals, ftGoals: ftGoals,
            btts: btts, exactScore: exactScore, cardsPred: cardsPred,
            foulsPred: foulsPred, throwIns: throwIns, cornersPred: cornersPred,
            goalKicks: goalKicks, shotsDisplay: shotsDisplay, scenarioText: scenarioText,
            confidence: confidence
        };

        matchesList.unshift(matchObj);
        renderMatches();

        document.getElementById('input-team1').value = '';
        document.getElementById('input-team2').value = '';
    }

    function renderMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        if (matchesList.length === 0) return;

        matchesList.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <div class="match-header-banner">
                    <div class="team-name">${m.team1}</div>
                    <div class="match-time-badge ${m.isLive ? 'live' : ''}">${m.timeBadge}</div>
                    <div class="team-name">${m.team2}</div>
                </div>

                <!-- SCÉNARIO DE JEU -->
                <div class="scenario-box">
                    ${m.scenarioText}
                </div>

                <div class="grid-stats">
                    <div class="stat-box"><div class="stat-title">Victoire Directe</div><div class="stat-value">${m.issueFerme}</div></div>
                    <div class="stat-box"><div class="stat-title">Double Chance</div><div class="stat-value highlight">${m.doubleChance}</div></div>
                    <div class="stat-box"><div class="stat-title">Les 2 marquent (BTTS)</div><div class="stat-value highlight">${m.btts}</div></div>
                    <div class="stat-box"><div class="stat-title">Score Exact Estimé</div><div class="stat-value" style="color:var(--accent-orange);">${m.exactScore}</div></div>
                    
                    <div class="stat-box"><div class="stat-title">Buts Total</div><div class="stat-value">${m.totalGoals}</div></div>
                    <div class="stat-box"><div class="stat-title">Buts 1ère / 2ème MT</div><div class="stat-value">${m.htGoals} / ${m.ftGoals}</div></div>
                    
                    <div class="stat-box"><div class="stat-title">Corners</div><div class="stat-value">${m.cornersPred}</div></div>
                    <div class="stat-box"><div class="stat-title">Cartons Jaunes</div><div class="stat-value">${m.cardsPred}</div></div>
                    
                    <div class="stat-box"><div class="stat-title">Fautes</div><div class="stat-value">${m.foulsPred}</div></div>
                    <div class="stat-box"><div class="stat-title">Touches</div><div class="stat-value">${m.throwIns}</div></div>
                    
                    <div class="stat-box"><div class="stat-title">Dégagements Gardien</div><div class="stat-value">${m.goalKicks}</div></div>
                    <div class="stat-box" style="grid-column: 1 / -1;"><div class="stat-title">Tirs & Tirs Cadrés</div><div class="stat-value" style="color:var(--neon-blue);">${m.shotsDisplay}</div></div>
                    
                    <div class="stat-box" style="grid-column: 1 / -1;"><div class="stat-title">Indice de Fiabilité Robot (v1000.9)</div><div class="stat-value highlight">${m.confidence}%</div></div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.onload = function() {
        initWeeklyUpdateCycle();
    };
</script>

</body>
</html>
