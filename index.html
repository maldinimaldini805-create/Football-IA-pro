<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot OMEGA PRO v1000.9 - Générateur de Combiné</title>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --neon-blue: #38bdf8;
            --accent-red: #ef4444;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .match-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .match-details {
            flex: 1;
        }

        .team-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .match-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        #ticket-result {
            display: none;
            background: #0f172a;
            border: 2px solid var(--accent-orange);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
        }

        #ticket-result h3 {
            margin-top: 0;
            color: var(--accent-orange);
            font-size: 1.1rem;
            text-align: center;
        }

        .ticket-item {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-green);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT OMEGA PRO</h1>
        <span style="color:var(--accent-green); font-size: 0.8rem;">GÉNÉRATEUR DE COMBINÉS</span>
    </div>

    <!-- Liste des Matchs disponibles -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--neon-blue);">⚽ Coche les matchs pour le combiné</h3>
        <div id="matches-list">
            
            <div class="match-card">
                <input type="checkbox" class="match-checkbox" value="Real Madrid vs FC Barcelone" id="m1">
                <div class="match-details">
                    <label for="m1" class="team-title">Real Madrid vs FC Barcelone</label>
                    <div class="match-info">Cotes: 2.10 | 3.30 | 3.40</div>
                </div>
            </div>

            <div class="match-card">
                <input type="checkbox" class="match-checkbox" value="Arsenal vs Chelsea" id="m2">
                <div class="match-details">
                    <label for="m2" class="team-title">Arsenal vs Chelsea</label>
                    <div class="match-info">Cotes: 1.85 | 3.50 | 4.20</div>
                </div>
            </div>

            <div class="match-card">
                <input type="checkbox" class="match-checkbox" value="Bayern vs Dortmund" id="m3">
                <div class="match-details">
                    <label for="m3" class="team-title">Bayern Munich vs Borussia Dortmund</label>
                    <div class="match-info">Cotes: 1.60 | 4.00 | 5.00</div>
                </div>
            </div>

        </div>

        <button class="action-btn" onclick="genererTicketCombine()">🎯 Générer le Ticket Combiné par le Robot</button>
    </div>

    <!-- Zone du Ticket de Combiné -->
    <div id="ticket-result">
        <h3>🎫 Ticket Combiné Conseillé</h3>
        <div id="ticket-items"></div>
    </div>
</div>

<script>
    async function genererTicketCombine() {
        const checkboxes = document.querySelectorAll('.match-checkbox:checked');
        const matchsSelectionnes = [];

        checkboxes.forEach(cb => {
            matchsSelectionnes.push(cb.value);
        });

        if (matchsSelectionnes.length < 2) {
            alert("Veuillez cocher au moins 2 matchs pour que le robot génère un combiné !");
            return;
        }

        try {
            const response = await fetch('/api/combine', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ matchs: matchsSelectionnes })
            });

            const data = await response.json();
            
            if (data.status === 'success') {
                afficherTicket(data.combine);
            }
        } catch (erreur) {
            console.error("Erreur de connexion avec le robot Python:", erreur);
        }
    }

    function afficherTicket(combineData) {
        const container = document.getElementById('ticket-result');
        const list = document.getElementById('ticket-items');
        list.innerHTML = '';

        combineData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'ticket-item';
            div.innerHTML = `
                <div><strong>Match :</strong> ${item.match}</div>
                <div><strong>Choix Robot :</strong> <span style="color:var(--accent-green);">${item.choix}</span></div>
                <div><strong>Confiance calculée :</strong> ${item.pourcentage}%</div>
            `;
            list.appendChild(div);
        });

        container.style.display = 'block';
    }
</script>

</body>
</html>
