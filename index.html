<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot de Prédictions Ultra-Détaillées Football</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --success-color: #22c55e;
            --warning-color: #eab308;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        /* MENU DE FILTRES DES PRÉDICTIONS */
        .filter-menu {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .filter-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button.action-btn {
            background-color: var(--success-color);
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .match-card {
            border-left: 5px solid var(--accent-color);
            margin-bottom: 20px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .grid-stats {
                grid-template-columns: 1fr;
            }
        }

        .stat-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 0.9rem;
        }

        .stat-title {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .stat-value {
            color: var(--text-color);
            font-weight: bold;
        }

        .badge-confidence {
            display: inline-block;
            background: var(--success-color);
            color: black;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Robot Pronostics Multi-Statistiques 90%</h1>

    <!-- BARRE DE NAVEGATION / FILTRES DU MENU -->
    <div class="filter-menu">
        <button class="filter-btn active" onclick="setCategory('all', this)">🌐 Tout Afficher</button>
        <button class="filter-btn" onclick="setCategory('main', this)">🏆 Principal (1N2 & Buts)</button>
        <button class="filter-btn" onclick="setCategory('fast', this)">⚡ Événements Rapides & 1er But</button>
        <button class="filter-btn" onclick="setCategory('shots', this)">🎯 Tirs & Corners</button>
        <button class="filter-btn" onclick="setCategory('fouls', this)">🟨 Cartons, Fautes & Touches</button>
    </div>

    <!-- COMMANDES -->
    <div class="card">
        <button class="action-btn" onclick="fetchRealMatches()">🔄 Charger Tous les Événements & Stats</button>
        <input type="text" id="search-input" placeholder="🔍 Filtrer par équipe ou ligue..." onkeyup="filterMatches()">
    </div>

    <!-- CONTENEUR DES MATCHS -->
    <div id="matches-container">
        <p style="text-align:center; color: #94a3b8;">Cliquez sur le bouton pour générer la liste complète des événements.</p>
    </div>
</div>

<script src="config.js"></script>

<script>
    let liveMatches = [];
    let currentCategory = 'all';

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMatches(liveMatches);
    }

    function getTodayDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    async function fetchRealMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = "<p style='text-align:center; color: #94a3b8;'>Analyse approfondie des événements en cours...</p>";

        if (typeof API_KEY === 'undefined' || !API_KEY || API_KEY === "TA_VRAIE_CLE_API_ICI") {
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center;'>⚠️ Clé API non configurée dans <strong>config.js</strong> !</p>";
            return;
        }

        const todayStr = getTodayDate();

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${todayStr}`, {
                "method": "GET",
                "headers": { "x-apisports-key": API_KEY }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = "<p style='text-align:center; color: #94a3b8;'>Aucun événement trouvé pour aujourd'hui.</p>";
                return;
            }

            liveMatches = result.response.map(item => {
                const homeName = item.teams.home.name;
                const awayName = item.teams.away.name;
                const homeGoals = item.goals.home ?? 0;
                const awayGoals = item.goals.away ?? 0;

                // ALGORITHME DES PRÉDICTIONS DÉTAILLÉES
                return {
                    team1: homeName,
                    team2: awayName,
                    league: item.league.name,
                    country: item.league.country,
                    score: `${homeGoals} - ${awayGoals}`,
                    status: item.fixture.status.short,
                    
                    // 1. PRINCIPAL
                    winner: homeGoals >= awayGoals ? `Double chance : ${homeName} / Nul` : `Double chance : ${awayName} / Nul`,
                    totalGoals: "Plus de 1.5 Buts",
                    
                    // 2. ÉVÉNEMENTS RAPIDES & PREMIER BUT
                    firstGoal: homeGoals >= awayGoals ? `Premier But : ${homeName}` : `Premier But : ${awayName}`,
                    fastEvent: "Premier événement : Touche / Coup franc dans les 5 min",

                    // 3. TIRS & CORNERS
                    shots: "Plus de 8.5 Tirs Cadrés au total",
                    corners: "Plus de 7.5 Corners dans le match",

                    // 4. CARTONS, FAUTES, TOUCHES, DÉGAGEMENTS
                    yellowCards: "Plus de 3.5 Cartons Jaunes",
                    fouls: "Plus de 21.5 Fautes commises",
                    throwIns: "Plus de 34.5 Touches",
                    clearances: "Plus de 16.5 Dégagements"
                };
            });

            renderMatches(liveMatches);

        } catch (error) {
            console.error(error);
            container.innerHTML = "<p style='color:var(--danger-color); text-align:center;'>Erreur lors de la récupération des statistiques.</p>";
        }
    }

    function renderMatches(data) {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: #94a3b8;'>Aucun match à afficher.</p>";
            return;
        }

        data.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';

            let statsHTML = '';

            if (currentCategory === 'all' || currentCategory === 'main') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🏆 Issue du Match</div><div class="stat-value">${m.winner}</div></div>
                    <div class="stat-box"><div class="stat-title">⚽ Nombre de Buts</div><div class="stat-value">${m.totalGoals}</div></div>
                `;
            }

            if (currentCategory === 'all' || currentCategory === 'fast') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🥇 Premier But</div><div class="stat-value">${m.firstGoal}</div></div>
                    <div class="stat-box"><div class="stat-title">⚡ Événement Rapide</div><div class="stat-value">${m.fastEvent}</div></div>
                `;
            }

            if (currentCategory === 'all' || currentCategory === 'shots') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🎯 Tirs Cadrés Total</div><div class="stat-value">${m.shots}</div></div>
                    <div class="stat-box"><div class="stat-title">🚩 Nombre de Corners</div><div class="stat-value">${m.corners}</div></div>
                `;
            }

            if (currentCategory === 'all' || currentCategory === 'fouls') {
                statsHTML += `
                    <div class="stat-box"><div class="stat-title">🟨 Cartons Jaunes</div><div class="stat-value">${m.yellowCards}</div></div>
                    <div class="stat-box"><div class="stat-title">🛑 Fautes Totales</div><div class="stat-value">${m.fouls}</div></div>
                    <div class="stat-box"><div class="stat-title">🖐️ Touches Touches</div><div class="stat-value">${m.throwIns}</div></div>
                    <div class="stat-box"><div class="stat-title">🛡️ Dégagements</div><div class="stat-value">${m.clearances}</div></div>
                `;
            }

            card.innerHTML = `
                <h3 style="margin:0 0 5px 0;">${m.team1} <span style="color:var(--warning-color);">${m.score}</span> ${m.team2}</h3>
                <p style="margin:0 0 10px 0; font-size:0.85rem; color:#94a3b8;">🏆 ${m.league} (${m.country})</p>
                <div class="grid-stats">${statsHTML}</div>
                <span class="badge-confidence">🔥 Indice de Fiabilité : 90%</span>
            `;

            container.appendChild(card);
        });
    }

    function filterMatches() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const filtered = liveMatches.filter(m => 
            m.team1.toLowerCase().includes(search) || 
            m.team2.toLowerCase().includes(search) ||
            m.league.toLowerCase().includes(search)
        );
        renderMatches(filtered);
    }
</script>

</body>
</html>
