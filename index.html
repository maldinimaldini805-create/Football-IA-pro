<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot de Prédiction Football - Module Avant-Match Complet</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b0f19;
            --card-border: #1f2937;
            --text-color: #f9fafb;
            --accent-color: #10b981;
            --warning-color: #f59e0b;
            --neon-blue: #38bdf8;
            --fire-gradient: linear-gradient(135deg, #ef4444, #f97316);
            --gold-gradient: linear-gradient(135deg, #10b981, #059669);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-size: 1.8rem;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--neon-blue);
            margin-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: #030712;
            color: white;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .section-label {
            font-size: 0.8rem;
            color: #9ca3af;
            font-weight: bold;
            margin-top: 8px;
            grid-column: 1 / -1;
        }

        button.action-btn {
            background: var(--gold-gradient);
            color: white;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            font-size: 1rem;
        }

        .combo-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button.combo-btn {
            background: linear-gradient(135deg, #10b981, #047857);
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        button.big-odds-btn {
            background: var(--fire-gradient);
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* STYLE D'AFFICHAGE DU MATCH (INSPIRÉ DE L'IMAGE) */
        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .match-header-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #030712;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            text-align: center;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            flex: 1;
        }

        .match-time-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }

        .odds-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .odd-box {
            flex: 1;
            background: #030712;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            text-align: center;
        }

        .odd-title {
            font-size: 0.75rem;
            color: #6b7280;
            font-weight: bold;
        }

        .odd-value {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 4px;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box {
            background: #030712;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .stat-title {
            color: #6b7280;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .stat-value {
            color: #f9fafb;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .combo-box {
            background: linear-gradient(135deg, #064e3b, #0f172a);
            border: 2px solid #10b981;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .combo-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #10b981;
        }

        .export-btn {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>ROBOT PRÉDICTION AVANT-MATCH</h1>
    </div>

    <!-- FORMULAIRE DE SAISIE DU MATCH (INSPIRÉ DE VOTRE CAPTURE) -->
    <div class="card">
        <div class="card-title">⚽ Saisir les données du Match à venir</div>
        <div class="form-grid">
            <div class="section-label">Équipes & Horaire</div>
            <input type="text" id="input-team1" placeholder="Équipe 1 (ex: Inter Miami)">
            <input type="text" id="input-team2" placeholder="Équipe 2 (ex: Columbus Crew)">
            <input type="text" id="input-time" placeholder="Heure (ex: 23:30)">

            <div class="section-label">Cotes bookmaker (1X2)</div>
            <input type="number" step="0.01" id="input-cote1" placeholder="Cote 1 (ex: 1.57)">
            <input type="number" step="0.01" id="input-coteX" placeholder="Cote X (ex: 4.50)">
            <input type="number" step="0.01" id="input-cote2" placeholder="Cote 2 (ex: 5.25)">

            <div class="section-label">Forme / Moyenne de Points (Optionnel)</div>
            <input type="number" step="0.1" id="input-pts1" placeholder="Pts/Match Équipe 1 (ex: 2.50)">
            <input type="number" step="0.1" id="input-pts2" placeholder="Pts/Match Équipe 2 (ex: 1.30)">
        </div>
        <button class="action-btn" onclick="addMatchAndAnalyze()">🧠 Analyser & Ajouter le Match</button>
    </div>

    <!-- GENERATION DU COMBINÉ RAPIDE -->
    <div class="card">
        <div class="card-title">🎯 Générer un Ticket Combiné Instantané</div>
        <div class="combo-buttons-grid">
            <button class="combo-btn" onclick="generateCombo(2)">🛡️ Combiné 2 Matchs (Sécurisé)</button>
            <button class="big-odds-btn" onclick="generateCombo(4)">🚀 Combiné 4 Matchs (Grosse Cote)</button>
        </div>
    </div>

    <!-- ZONE DE L'IMAGE DU COMBINÉ -->
    <div id="combo-container" class="combo-box"></div>

    <!-- LISTE DES MATCHS ANALYSÉS -->
    <div id="matches-container">
        <p style="text-align:center; color: #6b7280; padding: 20px;">Remplissez le formulaire ci-dessus pour ajouter des matchs au robot.</p>
    </div>
</div>

<script>
    let prematchList = [];

    function addMatchAndAnalyze() {
        const t1 = document.getElementById('input-team1').value.trim();
        const t2 = document.getElementById('input-team2').value.trim();
        const time = document.getElementById('input-time').value.trim() || "Aujourd'hui";
        const c1 = parseFloat(document.getElementById('input-cote1').value) || 2.00;
        const cX = parseFloat(document.getElementById('input-coteX').value) || 3.20;
        const c2 = parseFloat(document.getElementById('input-cote2').value) || 3.50;
        const pts1 = parseFloat(document.getElementById('input-pts1').value) || 1.5;
        const pts2 = parseFloat(document.getElementById('input-pts2').value) || 1.2;

        if (!t1 || !t2) {
            alert("Veuillez saisir au moins les noms des deux équipes.");
            return;
        }

        // Calcul dynamique des probabilités basé sur les cotes et la forme
        const prob1 = (1 / c1) * 100;
        const prob2 = (1 / c2) * 100;
        const probX = (1 / cX) * 100;

        // Indice de confiance calculé par le robot
        const maxProb = Math.max(prob1, prob2);
        const calculatedConfidence = parseFloat((maxProb + (pts1 > pts2 ? 10 : 0)).toFixed(1));

        // Détermination des sélections
        let straightWinner = "";
        let doubleChance = "";

        if (prob1 > prob2) {
            straightWinner = `Victoire Ferme : 1 (${t1})`;
            doubleChance = `Double Chance : 1X (${t1} ou Nul)`;
        } else {
            straightWinner = `Victoire Ferme : 2 (${t2})`;
            doubleChance = `Double Chance : X2 (${t2} ou Nul)`;
        }

        const matchData = {
            team1: t1,
            team2: t2,
            time: time,
            c1: c1.toFixed(2),
            cX: cX.toFixed(2),
            c2: c2.toFixed(2),
            pts1: pts1,
            pts2: pts2,
            confidence: Math.min(98, Math.max(60, calculatedConfidence)),
            straightWinner: straightWinner,
            doubleChance: doubleChance,
            goalsOption: c1 < 1.80 || c2 < 1.80 ? "Plus de 1.5 Buts" : "Moins de 3.5 Buts",
            bestOdd: Math.min(c1, c2) < 1.60 ? Math.min(c1, c2) : 1.35
        };

        prematchList.unshift(matchData);
        renderMatches();

        // Réinitialiser les champs
        document.getElementById('input-team1').value = '';
        document.getElementById('input-team2').value = '';
    }

    function renderMatches() {
        const container = document.getElementById('matches-container');
        container.innerHTML = '';

        if (prematchList.length === 0) {
            container.innerHTML = `<p style='text-align:center; color: #6b7280; padding: 20px;'>Aucun match disponible.</p>`;
            return;
        }

        prematchList.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <div class="match-header-banner">
                    <div class="team-name">${m.team1}</div>
                    <div class="match-time-badge">${m.time}</div>
                    <div class="team-name">${m.team2}</div>
                </div>

                <div class="odds-row">
                    <div class="odd-box"><div class="odd-title">1</div><div class="odd-value">${m.c1}</div></div>
                    <div class="odd-box"><div class="odd-title">X</div><div class="odd-value">${m.cX}</div></div>
                    <div class="odd-box"><div class="odd-title">2</div><div class="odd-value">${m.c2}</div></div>
                </div>

                <div class="grid-stats">
                    <div class="stat-box"><div class="stat-title">Victoire Directe</div><div class="stat-value">${m.straightWinner}</div></div>
                    <div class="stat-box"><div class="stat-title">Double Chance (Sécurité)</div><div class="stat-value">${m.doubleChance}</div></div>
                    <div class="stat-box"><div class="stat-title">Option Buts</div><div class="stat-value">${m.goalsOption}</div></div>
                    <div class="stat-box"><div class="stat-title">Indice Robot</div><div class="stat-value" style="color:#10b981;">${m.confidence}%</div></div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function generateCombo(count) {
        const comboBox = document.getElementById('combo-container');

        if (prematchList.length === 0) {
            alert("Veuillez d'abord ajouter des matchs !");
            return;
        }

        const selected = prematchList.slice(0, count);
        let totalOdd = 1.0;
        let itemsHTML = '';

        selected.forEach(m => {
            const matchOdd = parseFloat(m.bestOdd);
            totalOdd *= matchOdd;
            itemsHTML += `
                <div class="combo-item">
                    <strong>⚽ ${m.team1} vs ${m.team2} (${m.time})</strong><br>
                    📌 Sélection : <span style="color:#10b981;">${m.doubleChance}</span><br>
                    📊 Indice : <strong>${m.confidence}%</strong>
                </div>
            `;
        });

        comboBox.style.display = 'block';
        comboBox.innerHTML = `
            <div id="ticket-capture">
                <div style="font-weight:bold; color:#34d399; margin-bottom:10px; display:flex; justify-content:space-between;">
                    <span>⚡ COMBINÉ AVANT-MATCH (${selected.length} MATCHS)</span>
                    <span>COTE ESTIMÉE : <strong>${totalOdd.toFixed(2)}</strong></span>
                </div>
                ${itemsHTML}
            </div>
            <button class="export-btn" onclick="downloadTicketImage()">📸 Télécharger le Ticket</button>
        `;
    }

    function downloadTicketImage() {
        const element = document.getElementById('ticket-capture');
        html2canvas(element, { backgroundColor: '#0b0f19' }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'combine-avant-match.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
